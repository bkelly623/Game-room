<!doctype html>
<html lang="en">
<head>
<script src="../_kid.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spell Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Andika:wght@700&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--disp:'Lilita One','Arial Black',Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#140F33;color:#fff;font-family:Fredoka,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(15,10,40,.72);border-radius:14px;padding:6px 12px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap}
#pos{font-family:var(--disp);font-size:26px;font-weight:400}
#pos small{font-size:15px;opacity:.8}
#hearts{font-size:20px;letter-spacing:1px}
#word{margin:0 auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);color:#22163F;border-radius:20px;padding:6px 14px 6px 8px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#pic{font-size:44px;line-height:1}
#tiles{display:flex;gap:6px}
.t{min-width:40px;height:50px;border-radius:10px;border:3px dashed #B9AFD6;display:grid;place-items:center;font:700 32px Andika,Fredoka,sans-serif;padding:0 4px}
.t.cur{border:3px solid #FF8A3C;box-shadow:0 0 0 4px rgba(255,138,60,.3);animation:blink 1s infinite}
.t.ok{border:3px solid #3DCB6C;background:#E4FBEA}
.t.bad{border:3px solid #FF5A5F;background:#FFE5E6;color:#C8262B}
@keyframes blink{50%{box-shadow:0 0 0 8px rgba(255,138,60,.12)}}
#say{width:48px;height:48px;border-radius:14px;background:#3A7BFF;color:#fff;font-size:24px;box-shadow:0 4px 0 #1F4CB5}
#pause{width:44px;height:40px;justify-content:center;padding:0}
.ctl{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));width:min(26vw,140px);height:min(26vw,140px);border-radius:50%;background:rgba(255,255,255,.18);border:4px solid rgba(255,255,255,.45);display:grid;place-items:center;font-size:56px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.ctl:active,.ctl.on{background:rgba(255,255,255,.4)}
#item{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + min(26vw,140px) + 16px);width:96px;height:96px;border-radius:24px;background:linear-gradient(180deg,#FFE45C,#FF8A3C);border:4px solid #fff;font-size:56px;box-shadow:0 6px 0 rgba(0,0,0,.3);display:grid;place-items:center;animation:pulse 1s infinite}
#item.empty{background:rgba(255,255,255,.12);border:4px dashed rgba(255,255,255,.4);animation:none;box-shadow:none}
@keyframes pulse{50%{transform:scale(1.07)}}
#cl{left:max(16px,env(safe-area-inset-left))}#cr{right:max(16px,env(safe-area-inset-right))}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-family:var(--disp);font-size:clamp(40px,9vw,90px);text-shadow:0 5px 0 #5B2A00,0 0 30px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:scale(.7);transition:opacity .2s,transform .2s}
#banner.on{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:Fredoka,sans-serif;font-size:.35em;text-shadow:0 2px 0 #000}
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,9,40,.7);overflow:auto}
.card{background:linear-gradient(180deg,#3A2C8A,#241A5C);border-radius:26px;padding:22px;max-width:620px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3)}
h1,h2{font-family:var(--disp);font-weight:400;margin:0}
.logo{font-family:var(--disp);font-size:clamp(54px,12vw,100px);line-height:.9;color:#FFC93C;text-shadow:0 6px 0 #B5480E,0 10px 0 #5B2A00;transform:rotate(-4deg);margin:4px 0 14px}
.logo span{display:block;color:#5EE0FF;font-size:.75em;text-shadow:0 5px 0 #1F4CB5,0 9px 0 #0E1F55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:13px 24px;font-family:var(--disp);font-size:26px;background:#FFC93C;color:#4A2A00;box-shadow:0 6px 0 #E09B12;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #E09B12}
.btn.blue{background:#3A7BFF;color:#fff;box-shadow:0 6px 0 #1F4CB5}.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn.small{font-size:19px;padding:9px 16px}
.sub{color:#DCD2FF;font-weight:600;margin:8px 0}
#medal{font-size:90px;line-height:1.1}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.stats div{background:rgba(255,255,255,.1);border-radius:14px;padding:8px 14px;font-weight:700}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.item{background:rgba(255,255,255,.1);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.item.on{box-shadow:inset 0 0 0 3px #3DCB6C}
.item canvas{width:100px;height:70px}
.item b{font-size:15px}
.trk{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.trk button{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;min-width:120px;font-weight:700}
.trk button.lock{opacity:.4}
.trk button.on{box-shadow:inset 0 0 0 3px #FFC93C}
.trk span{display:block;font-size:34px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;background:#5B3FD6;border-radius:16px;padding:10px 18px;font-weight:700;font-size:20px;box-shadow:0 5px 0 #2F1F86;pointer-events:none;transition:opacity .3s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
 <button class="pill" id="pause" aria-label="Pause">⏸</button>
 <div class="pill" id="pos">1<small>st</small></div>
 <div class="pill" id="hearts"></div>
 <div id="word"><span id="pic"></span><div id="tiles"></div><button id="say" aria-label="Say the word">🔊</button></div>
 <div class="pill" id="coins">🪙 0</div>
</div>
<button class="ctl" id="cl" hidden aria-label="Left">◀</button>
<button class="ctl" id="cr" hidden aria-label="Right">▶</button>
<button id="item" hidden aria-label="Use item"></button>
<div id="banner"></div>
<div id="toast" style="opacity:0"></div>

<div class="scr" id="title"><div class="card">
 <div class="logo">SPELL<span>RACER</span></div>
 <p class="sub" id="tWho"></p>
 <div class="trk" id="tracks"></div>
 <button class="btn" id="go">🏁 Race!</button><br>
 <button class="btn blue small" id="garage">🔧 Garage</button>
 <p class="sub" style="font-size:15px;opacity:.85">Drive through the right letters to spell the word, and the right answer at every question gate. Wrong = CRASH! Grab ? boxes for bananas, shells and rockets.</p>
</div></div>

<div class="scr" id="result" hidden><div class="card">
 <div id="medal"></div><h1 id="rT"></h1><p class="sub" id="rS"></p>
 <div class="stats" id="rStats"></div>
 <button class="btn" id="rNext">Next race ▶</button><button class="btn blue small" id="rGar">🔧 Garage</button><button class="btn ghost small" id="rHome">🏠</button>
</div></div>

<div class="scr" id="gar" hidden><div class="card" style="max-width:760px">
 <h1>🔧 Garage</h1><p class="sub">🪙 <span id="gCoins">0</span></p>
 <div class="grid" id="gList"></div>
 <button class="btn" id="gDone">Done</button>
</div></div>

<div class="scr" id="pz" hidden><div class="card"><h1>Paused</h1><button class="btn" id="pGo">▶ Keep racing</button><br><button class="btn ghost small" id="pQuit">🏳️ Quit race</button></div></div>

<script>
'use strict';
/*WORDS*/
const $=s=>document.querySelector(s);
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const WORDS=SKILLS.map((S,si)=>S.w.map(spec=>{const [w,seg,em]=spec.split(':');return{w,seg:seg.split('.'),em,s:si}}));

/* ---------- save ---------- */
const KEY='spellracer.v1';let D;
function fresh(){return{v:1,coins:0,track:0,unlocked:1,cups:{},car:'red',owned:['red'],lv:null,m:[],sp:{q:0,ok:0},recent:[],missed:{},races:0,wins:0,days:{}}}
function load(){D=fresh();try{const s=localStorage.getItem(KEY);if(s)D=Object.assign(fresh(),JSON.parse(s))}catch(e){}while(D.m.length<WORDS.length)D.m.push(0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function kid(){try{return window.__kidInfo?window.__kidInfo():null}catch(e){return null}}
/* where to start: Luca can spell cat and stop, so short vowels first */
function startLevel(){const k=kid();if(D.lv==null){D.lv=k&&k.speak?2:3}return D.lv}

/* ---------- learning: pick words, track mastery ---------- */
function focus(){const st=startLevel();for(let i=0;i<WORDS.length;i++)if(i>=Math.max(0,st-1)&&D.m[i]<.8)return i;return WORDS.length-1}
function pickWords(n){const f=focus(),out=[];const missed=Object.keys(D.missed).filter(w=>D.missed[w]>0).map(w=>WORDS.flat().find(x=>x.w===w)).filter(Boolean);
 for(let i=0;i<n;i++){let w=null;if(missed.length&&rnd()<.3)w=missed.splice(ri(0,missed.length-1),1)[0];
  if(!w){const s=rnd()<.25&&f>0?f-1:f;const pool=WORDS[s].filter(x=>!out.includes(x)&&!D.recent.includes(x.w));w=pick(pool.length?pool:WORDS[s])}
  out.push(w);D.recent.push(w.w);if(D.recent.length>14)D.recent.shift()}return out}
function gradeWord(w,ok){D.sp.q++;if(ok)D.sp.ok++;const s=w.s;D.m[s]=ok?D.m[s]+(1-D.m[s])*.25:D.m[s]*.85;if(ok&&D.m[s]>=.8&&s+1>=D.lv)D.lv=Math.min(WORDS.length,s+2);
 if(ok){if(D.missed[w.w])D.missed[w.w]--}else D.missed[w.w]=(D.missed[w.w]||0)+2;
 const t=new Date().toISOString().slice(0,10),dd=D.days[t]||(D.days[t]={q:0,ok:0});dd.q++;if(ok)dd.ok++;
 try{window.__trk&&__trk.ans({s:'sp',lv:s+1,it:w.w,ok})}catch(e){}save()}
function choicesFor(tile){const t=tileText(tile);const wrong=(CONF[tile]||CONF[t]||[]).map(tileText).filter(x=>x!==t);const extra='abcdefghijklmnoprstuw'.split('').filter(x=>x!==t&&!wrong.includes(x));
 while(wrong.length<2)wrong.push(extra.splice(ri(0,extra.length-1),1)[0]);return shuf([t,wrong[0],wrong[1]])}

/* ---------- quiz gates: math, sight words, reading. Each has its own level that climbs with good answers. ---------- */
const SIGHTL=[['the','and','a','see','can','go','is','in','it','my','me','we','up','look','big','red','run','you','said','here','jump','not','play','little','come','down'],
 ['all','am','are','at','be','but','came','did','do','eat','get','good','have','he','into','like','must','new','now','on','out','please','ran','ride','saw','she','so','that','they','this','under','want','was','well','went','what','who','will','with','yes'],
 ['after','again','an','any','ask','by','could','every','fly','from','give','going','had','has','her','him','his','how','just','know','let','live','may','of','old','once','open','over','put','some','stop','take','thank','them','then','think','walk','were','when'],
 ['always','around','because','been','before','best','both','call','does','fast','first','found','gave','goes','green','made','many','off','pull','right','sing','sleep','tell','their','these','those','upon','very','wash','which','why','wish','work','would','write','your']];
const HOMO=[['to','two','too'],['for','four'],['here','hear'],['no','know'],['one','won'],['red','read'],['see','sea'],['right','write'],['there','their']];
const homo=(a,b)=>HOMO.some(g=>g.includes(a)&&g.includes(b));
function numOpts(a){const o=new Set([a]);const c=[a+1,a-1,a+2,a-2,a+10].filter(x=>x>=0);shuf(c);for(const x of c){if(o.size>=3)break;o.add(x)}let k=3;while(o.size<3)o.add(a+k++);return shuf([...o].map(String))}
function mathQ(lv){let a,b,t,op;switch(lv){case 1:a=ri(1,4);b=ri(1,5-a);t=a+b;op='+';break;case 2:a=ri(2,8);b=ri(1,10-a);t=a+b;op='+';break;case 3:a=ri(4,10);b=ri(1,a-1);t=a-b;op='−';break;
 case 4:if(rnd()<.5){a=ri(6,14);b=ri(2,20-a);t=a+b;op='+'}else{a=ri(11,20);b=ri(2,9);t=a-b;op='−'}break;case 5:a=ri(1,6)*10;b=ri(1,9-a/10)*10;if(rnd()<.5){t=a+b;op='+'}else{[a,b]=[Math.max(a,b),Math.min(a,b)];t=a-b;op='−'}break;
 default:a=pick([2,5,10]);b=ri(1,10);t=a*b;op='×'}
 const sp={'+':'plus','−':'minus','×':'times'}[op];return{kind:'quiz',sub:'ma',prompt:`${a} ${op} ${b} = ?`,ans:String(t),opts:numOpts(t),say:`${a} ${sp} ${b}`,fix:`${a} ${op} ${b} = ${t}`,key:'ma:'+a+op+b}}
function sightQ(lv){const L=SIGHTL[lv-1];const w=pick(L);const sc=y=>(y[0]===w[0])+(y.length===w.length)+rnd();const o=L.filter(x=>x!==w&&!homo(x,w)).sort((x,y)=>sc(y)-sc(x)).slice(0,2);
 return{kind:'quiz',sub:'sw',prompt:'🔊 Find the word',ans:w,opts:shuf([w,...o]),say:'Find the word: '+w+'.',fix:'It was "'+w+'"',key:'sw:'+w}}
function readQ(lv){const pool=WORDS[Math.min(WORDS.length-1,lv-1)];const t=pick(pool);const sc=y=>(y.w[0]===t.w[0])*2+(y.w.slice(-1)===t.w.slice(-1))*2+(y.w.length===t.w.length)+rnd()*2;const o=WORDS.flat().filter(x=>x.w!==t.w&&x.em!==t.em).sort((x,y)=>sc(y)-sc(x)).slice(0,2).map(x=>x.w);
 return{kind:'quiz',sub:'rd',prompt:t.em+' ?',ans:t.w,opts:shuf([t.w,...o]),say:'Which word is this?',fix:'It says "'+t.w+'"',key:'rd:'+t.w}}
const QMAX={ma:6,sw:4,rd:8};
function qLv(sub){const k=kid();D.q=D.q||{};const Q=D.q[sub]||(D.q[sub]={lv:sub==='ma'?(k&&k.speak?2:4):sub==='sw'?1:(k&&k.speak?1:3),hist:[],recent:[]});return Q}
function makeQuiz(sub){const Q=qLv(sub);let q=null;for(let i=0;i<10;i++){q=sub==='ma'?mathQ(Q.lv):sub==='sw'?sightQ(Q.lv):readQ(Q.lv);if(!Q.recent.includes(q.key))break}Q.recent.push(q.key);if(Q.recent.length>15)Q.recent.shift();q.lv=Q.lv;return q}
/* climbs after a run of right answers; only steps down if things are going really badly */
function gradeQuiz(q,ok){const Q=qLv(q.sub);Q.hist.push(ok?1:0);if(Q.hist.length>10)Q.hist.shift();const acc=Q.hist.reduce((a,b)=>a+b,0)/Q.hist.length;
 const bk=q.sub==='ma'?'ma':'rd';D[bk]=D[bk]||{q:0,ok:0};D[bk].q++;if(ok)D[bk].ok++;
 let msg=null;if(Q.hist.length>=6&&acc>=.85&&Q.lv<QMAX[q.sub]){Q.lv++;Q.hist=[];msg='up'}else if(Q.hist.length>=8&&acc<.35&&Q.lv>1){Q.lv--;Q.hist=[]}
 try{window.__trk&&__trk.ans({s:q.sub,lv:q.lv,it:q.key,ok});if(msg)__trk.ev('lvl',{s:q.sub,to:Q.lv,dir:'up'})}catch(e){}save();return msg}

/* ---------- sound + speech ---------- */
let AC=null,eng=null;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();eng=AC.createOscillator();const g=AC.createGain();eng.type='sawtooth';eng.frequency.value=60;g.gain.value=.025;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;eng.connect(f);f.connect(g);g.connect(AC.destination);eng.start();eng._g=g}catch(e){AC=null}}
function tone(f,d,o={}){if(!AC)return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f+o.slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(AC.destination);os.start(t);os.stop(t+d+.05)}
function noise(d,v,f){if(!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(rnd()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start()}
const SFX={good(){[784,988,1319].forEach((f,i)=>tone(f,.12,{type:'triangle',vol:.1,at:i*.05}))},crash(){noise(.7,.5,900);tone(120,.5,{type:'sawtooth',vol:.15,slide:-80})},nitro(){noise(.6,.25,3000);tone(200,.6,{vol:.06,slide:600})},coin(){tone(1320,.06,{vol:.05});tone(1760,.1,{vol:.05,at:.05})},go(){tone(880,.4,{vol:.1})},beep(){tone(440,.2,{vol:.1})},win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,{vol:.07,at:i*.12}))},word(){[659,784,988,1319].forEach((f,i)=>tone(f,.14,{vol:.08,at:i*.07}))}};
let voice=null;function pv(){try{const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));voice=v.find(v=>/samantha|google us english|aria|jenny|allison|ava/i.test(v.name))||v.find(v=>/en[-_]us/i.test(v.lang))||v[0]||null}catch(e){}}
if('speechSynthesis' in window){pv();speechSynthesis.onvoiceschanged=pv}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=r||.85;if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
const sound=t=>SND[t]||tileText(t);

/* ---------- tracks + cars ---------- */
const TRACKS=[
 {n:'Sunny Meadow',e:'🌻',sky:['#6EC3F2','#CFF0FF'],grass:['#5DBB3E','#52A836'],rumble:['#E8414F','#FFFFFF'],road:['#6B6B78','#66666F'],side:'tree'},
 {n:'Taco Desert',e:'🌮',sky:['#FFB067','#FFE1A8'],grass:['#E8C27A','#DDB46A'],rumble:['#C8742E','#FFF0D0'],road:['#7A6A5A','#736454'],side:'cactus'},
 {n:'Candy Canyon',e:'🍭',sky:['#FFB8DA','#E0D4FF'],grass:['#FF9AC8','#F78ABE'],rumble:['#FFFFFF','#E8414F'],road:['#8A6AA8','#8264A0'],side:'candy'},
 {n:'Moon Speedway',e:'🌙',sky:['#0E0B24','#2A1E5C'],grass:['#3A3550','#332E48'],rumble:['#5EE0FF','#9A6AF2'],road:['#2A2A3A','#262636'],side:'rock'}];
const CARS={red:{n:'Red Rocket',c:'#E8414F',d:'#9A1E28',p:0},blue:{n:'Blue Zoom',c:'#3A7BFF',d:'#1F4CB5',p:30},green:{n:'Pickle Car',c:'#4EC85A',d:'#2E8A3A',p:40},gold:{n:'Gold Flash',c:'#FFC93C',d:'#C8861A',p:80},
 pink:{n:'Bubblegum',c:'#FF7BAC',d:'#C83E74',p:60},taco:{n:'Taco Truck',c:'#F2A12E',d:'#9A5A12',p:120,top:'🌮'},shark:{n:'Shark Car',c:'#7A8AA8',d:'#4A5670',p:150,top:'🦈'},duck:{n:'Duck Mobile',c:'#FFE45C',d:'#C8A81A',p:180,top:'🦆'},dino:{n:'Dino Racer',c:'#5DBB3E',d:'#2E6B1E',p:220,top:'🦖'}};

/* ---------- road (pseudo 3D) ---------- */
const SEG=200,LANES=[-.62,0,.62],ROADW=2000,CAMH=1000,FOV=100,DRAW=230,CAMD=1/Math.tan((FOV/2)*Math.PI/180),PZ=CAMH*CAMD;
let segs=[],trackLen=0,R=null;
const ease=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5);
function addSeg(curve,y){const n=segs.length,py=n?segs[n-1].p2.world.y:0;segs.push({i:n,p1:{world:{y:py,z:n*SEG},camera:{},screen:{}},p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}},curve,sprites:[],stripe:Math.floor(n/3)%2})}
function addRoad(e,h,l,curve,hill){const sy=segs.length?segs[segs.length-1].p2.world.y:0,ey=sy+hill*SEG,tot=e+h+l;
 for(let i=0;i<e;i++)addSeg(ease(0,curve,i/e),ease(sy,ey,i/tot));for(let i=0;i<h;i++)addSeg(curve,ease(sy,ey,(e+i)/tot));for(let i=0;i<l;i++)addSeg(ease(curve,0,i/l),ease(sy,ey,(e+h+i)/tot))}
function buildTrack(words){segs=[];addRoad(10,30,10,0,0);
 const gapRow=95,rows=[];let total=0;words.forEach(w=>total+=w.seg.length);
 const need=60+total*gapRow+words.length*(gapRow+60)+160;
 while(segs.length<need){const k=ri(0,5);if(k===0)addRoad(20,30,20,0,ri(-20,20));else if(k<3)addRoad(25,40,25,pick([-3,-2,2,3]),ri(-15,15));else addRoad(20,40,20,0,ri(-25,25))}
 /* letter rows */
 let z=70;const subs=shuf(['ma','sw','rd','ma','rd','sw']);words.forEach((w,wi)=>{w.seg.forEach((t,ti)=>{const opts=choicesFor(t);rows.push({kind:'spell',seg:z,wi,ti,tile:tileText(t),raw:t,opts,done:false});z+=gapRow});
  z+=45;const q=makeQuiz(subs[wi%subs.length]);rows.push(Object.assign(q,{seg:z,tile:q.ans,done:false,wi}));z+=gapRow});
 rows.forEach(r=>{const s1=segs[r.seg+40];if(s1){s1.box=[0,1,2].filter(()=>rnd()<.6);if(!s1.box.length)s1.box=[ri(0,2)]}const s2=segs[r.seg+62];if(s2&&rnd()<.5)s2.pad=ri(0,2)});
 const finish=z+40;
 /* scenery */
 const th=TRACKS[R.track];for(let i=20;i<segs.length;i+=ri(4,9)){segs[i].sprites.push({k:th.side,off:(rnd()<.5?-1:1)*(1.6+rnd()*1.6)})}
 for(let i=40;i<finish;i+=ri(30,60))segs[i].sprites.push({k:'sign',off:pick([-1.5,1.5]),t:pick(['GO GO GO!','NO BROCCOLI','SPELL FAST','HONK!','TACOS AHEAD','WHEEE!','SLOW? NEVER'])});
 rows.forEach(r=>{segs[r.seg].row=r});
 /* coins between rows */
 rows.forEach(r=>{for(let j=1;j<3;j++){const s=segs[r.seg+14+j*10];if(s&&!s.row)s.coin={lane:ri(0,2),got:false}}});
 segs[finish].finish=true;for(let i=finish;i<finish+3;i++)if(segs[i])segs[i].checker=true;
 trackLen=segs.length*SEG;return{rows,finish}}
function project(p,cx,cy,cz,w,h){p.camera.x=(p.world.x||0)-cx;p.camera.y=(p.world.y||0)-cy;p.camera.z=(p.world.z||0)-cz;p.screen.scale=CAMD/p.camera.z;p.screen.x=Math.round(w/2+p.screen.scale*p.camera.x*w/2);p.screen.y=Math.round(h/2-p.screen.scale*p.camera.y*h/2);p.screen.w=Math.round(p.screen.scale*ROADW*w/2)}
const segAt=z=>segs[Math.floor(z/SEG)%segs.length];

 const T=buildTrack(words);R.rows=T.rows;R.finish=T.finish*SEG;

  if(ok){R.nitro=2.2;SFX.good();SFX.nitro();burst('#FFD866',24);R.coins+=3;giveItem();if(up)setTimeout(()=>toast('⬆️ Harder questions unlocked!'),600)}

  if(R.hearts<=0){setTimeout(()=>endRace(false),900)}}

  setTimeout(()=>{if(!R||R.over)return;say(w.seg.map(tileText).join(', ')+'. '+w.w+'!',.85);if(ok){SFX.word();banner('⭐ '+w.w.toUpperCase()+'!','');R.coins+=5;hud()}},500);

const ITEMS=[{k:'banana',e:'🍌',n:'Banana'},{k:'shell',e:'🐢',n:'Turtle Shell'},{k:'rocket',e:'🚀',n:'Rocket Boost'},{k:'zap',e:'⚡',n:'Lightning'},{k:'star',e:'⭐',n:'Super Star'},{k:'boom',e:'💣',n:'Bean Bomb'}];

 else if(sp.k==='cactus'){const h=s*.7;cx.fillStyle='#3E9A3E';cx.fillRect(sx-h*.07,sy-h,h*.14,h);cx.fillRect(sx-h*.3,sy-h*.65,h*.1,h*.35);cx.fillRect(sx-h*.3,sy-h*.65,h*.25,h*.1);cx.fillRect(sx+h*.2,sy-h*.8,h*.1,h*.4);cx.fillRect(sx+h*.05,sy-h*.5,h*.25,h*.1)}

  if(s.finish){const w=s.p1.screen.w;cx.fillStyle='#fff';cx.fillRect(sx-w*1.1,sy-w*.9,w*.05,w*.9);cx.fillRect(sx+w*1.05,sy-w*.9,w*.05,w*.9);cx.fillStyle='#E8414F';cx.fillRect(sx-w*1.1,sy-w*.95,w*2.2,w*.18);cx.fillStyle='#fff';cx.font=`700 ${Math.max(8,w*.13)}px 'Lilita One',sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('FINISH',sx,sy-w*.86)}
  if(s.coin&&!s.coin.got&&sy<s.clip){const cxp=laneX(LANES[s.coin.lane]),r=sc*W/2*ROADW*.07;cx.fillStyle='#FFC93C';cx.strokeStyle='#B5841A';cx.lineWidth=Math.max(1,r*.2);cx.beginPath();cx.ellipse(cxp,sy-r*1.6,r*Math.abs(Math.cos(performance.now()/200)),r,0,0,7);cx.fill();cx.stroke()}
  if(s.box&&!s.boxGot&&sy<s.clip){for(const ln of s.box){const bx=laneX(LANES[ln]),bs=sc*W/2*ROADW*.13,t=performance.now()/300;cx.save();cx.beginPath();cx.rect(0,0,W,s.clip);cx.clip();cx.translate(bx,sy-bs*1.3+Math.sin(t+ln)*bs*.1);cx.rotate(Math.sin(t)*.2);const gr=cx.createLinearGradient(-bs/2,-bs/2,bs/2,bs/2);gr.addColorStop(0,'#5EE0FF');gr.addColorStop(.5,'#FF7BAC');gr.addColorStop(1,'#FFE45C');cx.fillStyle=gr;cx.globalAlpha=.9;cx.fillRect(-bs/2,-bs/2,bs,bs);cx.globalAlpha=1;cx.strokeStyle='#fff';cx.lineWidth=Math.max(1,bs*.08);cx.strokeRect(-bs/2,-bs/2,bs,bs);cx.fillStyle='#fff';cx.font=`700 ${Math.max(6,bs*.7)}px 'Lilita One',sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('?',0,bs*.04);cx.restore()}}
  if(s.pad!=null&&!s.padGot&&sy<s.clip){const px=laneX(LANES[s.pad]),pw=sc*W/2*ROADW*.22;cx.fillStyle='#FF8A3C';cx.beginPath();cx.moveTo(px-pw/2,sy);cx.lineTo(px,sy-pw*.35);cx.lineTo(px+pw/2,sy);cx.lineTo(px+pw/2,sy-pw*.12);cx.lineTo(px,sy-pw*.47);cx.lineTo(px-pw/2,sy-pw*.12);cx.closePath();cx.fill()}
  for(const b of R.bananas){if(Math.floor((((b.z%trackLen)+trackLen)%trackLen)/SEG)===s.i&&sy<s.clip){const bs=sc*W/2*ROADW*.12;cx.font=Math.max(6,bs)+'px sans-serif';cx.textAlign='center';cx.textBaseline='bottom';cx.fillText('🍌',laneX(LANES[b.lane]),sy)}}
  for(const sh of R.shots){if(Math.floor(sh.z/SEG)===s.i&&sy<s.clip){const bs=sc*W/2*ROADW*.12;cx.font=Math.max(6,bs)+'px sans-serif';cx.textAlign='center';cx.textBaseline='bottom';cx.fillText(sh.k==='boom'?'💣':'🐢',laneX(LANES[sh.lane]),sy)}}
  if(s.row){const r=s.row;r.opts.forEach((o,i)=>{const st=r.done?(i===R.lane&&r.picked?(o===r.tile?'ok':'bad'):(o===r.tile?'ok':null)):null;letterBlock(laneX(LANES[i]),sy,sc*W/2*ROADW,o,r.done?(o===r.tile?'ok':'bad'):null,s.clip)})}
  for(const rv of R.rivals){const rz=((rv.z%trackLen)+trackLen)%trackLen;if(Math.floor(rz/SEG)===s.i){const w=sc*W/2*ROADW*.32*(rv.small>0?.5:1);if(sy<s.clip)drawCar(laneX(LANES[rv.lane]),sy,w,rv.c,rv.d,rv.e,rv.spin>0?Math.sin(performance.now()/40)*.6:0)}}}
 /* player */
 const car=CARS[D.car]||CARS.red,pw=Math.min(W*.24,200),tilt=(LANES[R.lane]-R.x)*.6+(R.spin>0?Math.sin(R.spin*20)*.5:0),bob=Math.sin(performance.now()/60)*(R.speed>100?1.5:0);
 const shx=R.shake>0?(rnd()-.5)*R.shake:0;
 if(R.nitro>0){for(let i=0;i<3;i++){cx.fillStyle=pick(['#FFD866','#FF8A3C','#FF5A2A']);cx.beginPath();cx.ellipse(W/2+shx+(i-1)*pw*.18,H*.93+bob+rnd()*10,pw*.06,pw*.14+rnd()*pw*.1,0,0,7);cx.fill()}}
 if(R.star>0){cx.globalAlpha=.45;cx.fillStyle=['#FF5A6E','#FFC93C','#6BD66B','#5ED0F7','#9A6AF2'][(performance.now()/80|0)%5];cx.beginPath();cx.ellipse(W/2,H*.93-pw*.3,pw*.7,pw*.5,0,0,7);cx.fill();cx.globalAlpha=1}
 drawCar(W/2+shx,H*.93+bob,pw,car.c,car.d,car.top,tilt);
 if(flashT>0){cx.fillStyle=`rgba(255,255,255,${flashT*2})`;cx.fillRect(0,0,W,H)}
 for(const p of R.parts){cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,6,6)}cx.globalAlpha=1;
 if(R.nitro>0){cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=3;for(let i=0;i<10;i++){const a=rnd()*6.28,r0=H*.25,r1=H*.6;cx.beginPath();cx.moveTo(W/2+Math.cos(a)*r0,H*.5+Math.sin(a)*r0*.6);cx.lineTo(W/2+Math.cos(a)*r1,H*.5+Math.sin(a)*r1*.6);cx.stroke()}}}

/* ---------- loop ---------- */
let last=0,paused=false;
function update(dt){if(!R||R.over||paused)return;R.t+=dt;if(R.t<0){return}
 if(R.spin>0)R.spin-=dt;if(R.nitro>0)R.nitro-=dt;if(R.star>0)R.star-=dt;if(flashT>0)flashT-=dt;
 if(R.roll>0){R.roll-=dt;if(R.roll<=0){R.item=pick(ITEMS);toast(R.item.e+' '+R.item.n+'! Tap it to use.');const k=kid();if(k&&k.speak)say(R.item.n+'! Tap it!')}itemBtn()}if(R.shake>0)R.shake=Math.max(0,R.shake-dt*30);
 const target=R.spin>0?600:R.nitro>0?NITRO:R.star>0?MAXV*1.25:MAXV;R.speed+=(target>R.speed?ACCEL:-ACCEL*1.5)*dt;if(R.nitro>0&&R.speed<NITRO)R.speed=Math.min(NITRO,R.speed+ACCEL*2*dt);
 R.speed=clamp(R.speed,0,NITRO);R.pos+=R.speed*dt;
 R.x+=(LANES[R.lane]-R.x)*Math.min(1,dt*9);
 const pz=R.pos+PZ;
 for(const r of R.rows){if(!r.done&&pz>=r.seg*SEG+SEG*.5){r.picked=true;hitRow(r)}}
 const cs=segAt(pz);if(cs.coin&&!cs.coin.got&&cs.coin.lane===R.lane){cs.coin.got=true;R.coins++;SFX.coin();hud()}
 if(cs.box&&cs.box.includes(R.lane)&&!cs.boxGot){cs.boxGot=true;burst('#9AE6FF',16);giveItem()}
 if(cs.pad===R.lane&&!cs.padGot){cs.padGot=true;R.nitro=Math.max(R.nitro,1.3);SFX.nitro()}
 for(const b of R.bananas){if(!b.hit&&!b.mine&&Math.abs(b.z-pz)<SEG*.6&&b.lane===R.lane){b.hit=true;if(R.star>0)toast('⭐ Banana? No problem!');else{R.spin=.9;R.speed*=.4;SFX.crash();toast('🍌 Whoa! Banana!')}}
  for(const rv of R.rivals){if(!b.hit&&Math.abs(b.z-rv.z)<SEG*.6&&b.lane===rv.lane&&b.from!==rv){b.hit=true;rv.spin=1.6;if(b.mine)toast('🍌 '+rv.n+' slipped! HA!')}}}
 R.bananas=R.bananas.filter(b=>!b.hit&&b.z>R.pos-SEG*5);
 for(const s of R.shots){s.z+=NITRO*1.4*dt;if(s.tg){if(s.lane!==s.tg.lane&&rnd()<dt*6)s.lane+=Math.sign(s.tg.lane-s.lane);if(Math.abs(s.z-s.tg.z)<SEG){s.done=true;s.tg.spin=2;toast((s.k==='boom'?'💣 KABOOM! ':'🐢 BONK! ')+s.tg.n+' spun out!');SFX.crash()}}if(s.z>pz+SEG*120)s.done=true}
 R.shots=R.shots.filter(s=>!s.done);
 /* rivals: race well, rubber-band a little so it stays close */
 for(const rv of R.rivals){const gap=rv.z-pz;let v=rv.base+(gap>SEG*25?-500:gap<-SEG*25?700:0);if(rv.spin>0){rv.spin-=dt;v*=.3}if(rv.small>0)rv.small-=dt;rv.z+=v*dt;if(rnd()<dt*.5)rv.lane=ri(0,2);
  rv.dropT-=dt;if(rv.dropT<=0&&rv.z>pz+SEG*15&&rv.z<pz+SEG*90){rv.dropT=9+rnd()*8;const bz=rv.z-SEG*2,bs=segAt(bz);if(!bs.row)R.bananas.push({z:bz,lane:rv.lane,from:rv})}}
 for(const p of R.parts){p.life-=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}R.parts=R.parts.filter(p=>p.life>0);
 if(eng){eng.frequency.value=50+R.speed/40;eng._g.gain.value=.02+R.speed/NITRO*.03}
 hud();if(pz>=R.finish)endRace(true)}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame)}

/* ---------- menus ---------- */
function titleScr(){R=null;segs=[];$('#hud').hidden=true;$('#cl').hidden=$('#cr').hidden=true;$('#item').hidden=true;['result','gar','pz'].forEach(i=>$('#'+i).hidden=true);
 const k=kid();$('#tWho').textContent=(k?k.name+' · ':'')+'🏆 '+D.wins+' wins · 🪙 '+D.coins;
 $('#tracks').innerHTML=TRACKS.map((t,i)=>`<button class="${i>=D.unlocked?'lock':''}${i===D.track?' on':''}" data-t="${i}"><span>${i>=D.unlocked?'🔒':t.e}</span>${t.n}${D.cups[i]?' 🏆':''}</button>`).join('');
 $('#title').hidden=false;if(eng)eng._g.gain.value=0}
$('#tracks').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.t;if(i>=D.unlocked){toast('Win a race to unlock it!');return}D.track=i;save();titleScr()};
function start(){audioInit();$('#title').hidden=true;$('#result').hidden=true;newRace()}
$('#go').onclick=start;$('#rNext').onclick=()=>{if($('#rNext').textContent.startsWith('Next')&&D.track<D.unlocked-1)D.track++;save();start()};$('#rHome').onclick=titleScr;
function garage(){$('#gCoins').textContent=D.coins;$('#gList').innerHTML='';Object.keys(CARS).forEach(k=>{const C=CARS[k],own=D.owned.includes(k);const d=document.createElement('button');d.className='item'+(D.car===k?' on':'');
  const c=document.createElement('canvas');c.width=200;c.height=140;d.appendChild(c);const g=c.getContext('2d');drawMini(g,C);
  d.insertAdjacentHTML('beforeend',`<b>${C.n}</b><span>${own?(D.car===k?'✅ Driving':'Tap to drive'):'🪙 '+C.p}</span>`);
  d.onclick=()=>{if(own){D.car=k;save();garage()}else if(D.coins>=C.p){D.coins-=C.p;D.owned.push(k);D.car=k;save();SFX.win();garage()}else toast('Need 🪙 '+(C.p-D.coins)+' more coins')};$('#gList').appendChild(d)});$('#gar').hidden=false}
function drawMini(g,C){const w=150,h=w*.55;g.translate(100,120);
 g.fillStyle='#1A1A22';g.fillRect(-w*.48,-h*.32,w*.2,h*.32);g.fillRect(w*.28,-h*.32,w*.2,h*.32);g.fillStyle=C.d;g.beginPath();g.roundRect(-w*.5,-h*.85,w,h*.6,w*.08);g.fill();g.fillStyle=C.c;g.beginPath();g.roundRect(-w*.47,-h*.82,w*.94,h*.5,w*.07);g.fill();g.beginPath();g.roundRect(-w*.32,-h*1.15,w*.64,h*.42,w*.1);g.fill();g.fillStyle='#BFE3FF';g.beginPath();g.roundRect(-w*.26,-h*1.08,w*.52,h*.26,w*.06);g.fill();g.fillStyle='#FF3B3B';g.fillRect(-w*.44,-h*.62,w*.14,h*.12);g.fillRect(w*.3,-h*.62,w*.14,h*.12);if(C.top){g.font='44px sans-serif';g.textAlign='center';g.textBaseline='bottom';g.fillText(C.top,0,-h*1.1)}}
$('#garage').onclick=$('#rGar').onclick=()=>{audioInit();garage()};$('#gDone').onclick=()=>{$('#gar').hidden=true;if($('#result').hidden)titleScr()};
$('#say').onclick=()=>{audioInit();sayWord()};
$('#pause').onclick=()=>{if(!R||R.over)return;paused=true;$('#pz').hidden=false};$('#pGo').onclick=()=>{paused=false;$('#pz').hidden=true};$('#pQuit').onclick=()=>{paused=false;$('#pz').hidden=true;R.over=true;titleScr()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R&&!R.over){paused=true;$('#pz').hidden=false}});
/* controls: buttons, swipe, keys */
['cl','cr'].forEach((id,i)=>{const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');steer(i?1:-1)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')))});
let sx0=null;cv.addEventListener('pointerdown',e=>{sx0=e.clientX});cv.addEventListener('pointerup',e=>{if(sx0==null)return;const d=e.clientX-sx0;if(Math.abs(d)>30)steer(d>0?1:-1);else steer(e.clientX<W/2?-1:1);sx0=null});
$('#item').addEventListener('pointerdown',e=>{e.preventDefault();useItem()});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key===' '||e.key==='ArrowUp')useItem();if(e.key==='ArrowLeft'||e.key==='a')steer(-1);if(e.key==='ArrowRight'||e.key==='d')steer(1)});
