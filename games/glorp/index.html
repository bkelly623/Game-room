:root{

*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{height:100%;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px;min-width:0}
.top{width:100%;display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.brand{font-family:var(--display);font-weight:700;color:var(--slime);font-size:22px;margin-right:auto;text-shadow:0 2px 0 var(--slime-d);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;min-height:34px;font-variant-numeric:tabular-nums}
.chip i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF0A8,var(--sun) 55%,var(--sun-d));display:inline-block}
.ibtn{height:34px;border-radius:10px;border:2px solid var(--line);background:var(--panel);padding:0 10px;font-family:var(--display);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

#screen{position:relative;flex:none;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--line),0 0 0 6px #0C0A18,0 14px 44px rgba(0,0,0,.55)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated}

.hpbox .nm{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:max(15px,calc(var(--fs)*.95));line-height:1.1}

.tb{font-family:var(--display);font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:99px;color:#fff;letter-spacing:.03em}
.tb.word{background:#7A4CD6}.tb.number{background:#E0701E}

 {n:'Short a and i',st:0,tip:'Short a says /a/ like apple. Short i says /i/ like itch.',w:[['cat','The cat napped in a sunny spot.'],['map','We need a map to find the cave.'],['sit','Sit down on the rock.'],['big','That is a big spider.'],['hat','My hat has a lamp on it.'],['pin','Use a pin to hold the paper.'],['bag','Put the snacks in your bag.'],['lip','I bit my lip.'],['fan','The fan blew cool air.'],['dig','Let us dig for treasure.'],['rat','A rat ran past the door.'],['win','We will win the race.']]},

T..ppppppppppppppppppppp","T..pp......pp.........pT","T..pp......pp..........T","T..pp......pp..........T","T..pp......pp..........T","T..pp......pp..........T","T..pppppppppppppppppp..T","T.,..pp....pp....pp..,.T","T..........pp..........T","T......,...pp...,......T","TTTTTTTTTTTppTTTTTTTTTTT"],"cave":["TTTTTTTTTTTTTTTTTTTTTTTT","T..........ggg........cT","T.cc...T...ggg...T....cT","T.cc.......ggg.........T","T......TT.......TT.....T","T..ggg..........ggg....T","T..ggg...cc.....ggg..ccT","T..ggg...cc.....ggg..ccT","T....................ppp","TT.....TTTT..TTTT....ppT","T.......ggg..ggg.....ppT","T..cc...ggg..ggg.....ppT","T..cc...ggg..ggg.....ppT","T....................ppT","T~~~~..TT....T....ggg..T","T~~~~.......cc....ggg..T","T...........cc....ggg..T","ppppppp................T","TTTTTTTTTTTTTTTTTTTTTTTT"],"town3":["TTTTTTTTTTTpTTTTTTTTTTTT","T,.........pp.........,T","T..........pp..........T","T..........pp..........T","T..........pp..........T","T..........pp..........T","T....pp....pp....pp....T","T..pppppppppppppppppp..T","T.,........pp........,.T","T..........pp..........T","T..........pp..........T","T..........pp..........T","T....pp....pp....pp....T","pppppppppppppppppppp...T","T......,...,...........T","T..,.....~~~~~~....,...T","T........~~~~~~........T","TTTTTTTTTTTTTTTTTTTTTTTT"],"peak":["TTTTTTTTTTTTTTTTTTTTTTTT","T......................T","T......................T","T......................T","T......................T","T..........pp..........T","T,...T.....pp....T....,T","T.gggggg...pp...gggggg.T","T.gggggg...pp...gggggg.T","T.gggggg...pp...gggggg.T","T..........pp..........T","T~~~~~.....pp.....~~~~~T","T~~~~~.r...pp...r.~~~~~T","T..........pp..........T","Tgggggg..T.pp.T..ggggggT","Tgggggg....pp....ggggggT","Tgggggg....pp....ggggggT","T.....r....pp....r.....T","T..ggggggg.pp.ggggggg..T","T..ggggggg.pp.ggggggg..T","T..........pp..........T","TTTTTTTTTTTppTTTTTTTTTTT"]};

const MSK=[
 {n:'Adding within 20',g:'1-2',tip:'Start at the bigger number and count up.'},{n:'Subtracting within 20',g:'1-2',tip:'Count up from the small number to the big one.'},
 {n:'Adding 2-digit numbers',g:'2',tip:'Add the tens, then the ones.'},{n:'Subtracting 2-digit numbers',g:'2',tip:'Take away the tens first, then the ones.'},
 {n:'Place value to 1,000',g:'2',tip:'Hundreds, tens, ones: each place is 10 times the one to its right.'},{n:'Adding and subtracting 3-digit numbers',g:'3',tip:'Work one place at a time: hundreds, tens, ones.'},
 {n:'Times tables: 2, 5, 10',g:'2-3',tip:'Skip count: 5, 10, 15, 20...'},{n:'Times tables: 3, 4, 6',g:'3',tip:'Use a fact you know and add one more group.'},
 {n:'Times tables: 7, 8, 9',g:'3',tip:'Split it: 7 × 8 = 7 × 4 + 7 × 4.'},{n:'Division facts',g:'3',tip:'Think backwards: what times this number makes that?'},
 {n:'Missing numbers',g:'3',tip:'Undo it: if something + 5 = 12, take 5 away from 12.'},{n:'2-digit times 1-digit',g:'4',tip:'Split the big number into tens and ones, multiply each, add.'},
 {n:'Fractions',g:'3',tip:'1/4 of something means split it into 4 equal groups.'},{n:'Area and perimeter',g:'3',tip:'Area = length × width. Perimeter = all four sides added.'},

function MQ(s,text,ans,hint,say){return{subj:'math',s,text,ans:String(ans),hint,say:!!say}}
function genMath(s){switch(s){
 case 0:{const a=ri(3,12),b=ri(2,Math.min(9,20-a));return MQ(s,`${a} + ${b} = ?`,a+b,`Start at ${Math.max(a,b)} and count up ${Math.min(a,b)}.`)}
 case 1:{const a=ri(9,20),b=ri(2,Math.min(9,a-1));return MQ(s,`${a} − ${b} = ?`,a-b,`Count up from ${b} to ${a}. How many jumps?`)}
 case 2:{const a=ri(17,68),b=ri(14,Math.min(89,99-a));return MQ(s,`${a} + ${b} = ?`,a+b,`Tens first: ${a-a%10} + ${b-b%10} = ${a-a%10+b-b%10}. Then add ${a%10} + ${b%10}.`)}
 case 3:{const a=ri(41,98),b=ri(12,a-11);return MQ(s,`${a} − ${b} = ?`,a-b,`Take away ${b-b%10} first: ${a} − ${b-b%10} = ${a-(b-b%10)}. Then take away ${b%10}.`)}
 case 4:{const t=ri(0,2);if(t===0){const h=ri(1,9),te=ri(0,9),o=ri(1,9);return MQ(s,`${h} hundreds + ${te} tens + ${o} ones = ?`,h*100+te*10+o,`${h} hundreds is ${h*100}. ${te} tens is ${te*10}.`)}
   if(t===1){const n=ri(105,985);return MQ(s,`10 more than ${n} = ?`,n+10,`Only the tens digit goes up by one.`)}const n=ri(205,985);return MQ(s,`100 less than ${n} = ?`,n-100,`Only the hundreds digit goes down by one.`)}
 case 5:{if(rnd()<.5){const a=ri(120,699),b=ri(105,Math.min(899,999-a));return MQ(s,`${a} + ${b} = ?`,a+b,`Hundreds first: ${a-a%100} + ${b-b%100} = ${a-a%100+b-b%100}. Then tens, then ones.`)}
   const a=ri(320,980),b=ri(105,a-60);return MQ(s,`${a} − ${b} = ?`,a-b,`Take away ${b-b%100} first: ${a} − ${b-b%100} = ${a-(b-b%100)}. Then the rest.`)}
 case 6:{const f=pick([2,5,10]),b=ri(2,10);return MQ(s,rnd()<.5?`${f} × ${b} = ?`:`${b} × ${f} = ?`,f*b,`Count by ${f}s, ${b} times.`)}
 case 7:{const f=pick([3,4,6]),b=ri(3,10);const h=f===4?`Double ${b}, then double again: ${b*2}, ${b*4}.`:f===3?`${b} × 2 = ${b*2}. Add one more ${b}.`:`${b} × 5 = ${b*5}. Add one more ${b}.`;return MQ(s,rnd()<.5?`${f} × ${b} = ?`:`${b} × ${f} = ?`,f*b,h)}

  else{discX(x,8,9,6,'#16112A');discX(x,8,9,5,k==='mega'?'#FFCB3D':'#F4E6D0');x.fillStyle='#C8A070';x.fillRect(5,6,6,1);x.fillRect(6,4,4,1)}return c}
function openBag(){const render=()=>{showCard(head('Bag',`<b style="color:var(--sun)">${D.coins}</b> coins`)+`<div class="center" style="margin-bottom:12px"><button class="btn small" id="saveNow">Save game</button></div>`+`<div class="shop">${Object.keys(ITEMS).map(k=>`<div class="si" data-k="${k}"><span class="ic"></span><div><b>${ITEMS[k].n} × ${D.bag[k]||0}</b><small>${ITEMS[k].d}</small></div><div class="acts"></div></div>`).join('')}</div>
   <div class="sh">Badges</div><div class="badges">${['fizz','cheese','champ'].map(k=>`<div class="bdg${D.badges[k]?' got':''}">${D.badges[k]?badgeSVG(k,26):'<svg width="26" height="26" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#5446A0" stroke-width="2" stroke-dasharray="3 3"/></svg>'}${esc(GYMS[k].badge)}</div>`).join('')}</div>`);
  $('#ovCard').querySelectorAll('.si').forEach(el=>{const k=el.dataset.k;el.querySelector('.ic').replaceWith(itemIcon(k));if(false){}if((k==='dump'||k==='mega')&&D.bag[k]>0){const b=document.createElement('button');b.className='btn small';b.textContent='Use';b.onclick=()=>useItemMenu(k,render);el.querySelector('.acts').appendChild(b)}});$('#saveNow').onclick=e=>{save();if(cloud.ok){clearTimeout(cloud.t);cloudFlush()}e.target.textContent=cloud.ok?'Saved online!':'Saved on this device!';sfx('good')};$('#cX').onclick=closeCard};render()}
function useItemMenu(k,back){showCard(head('Who gets the '+ITEMS[k].n+'?')+`<div class="party">${D.party.map((m,i)=>partyRow(m,i,'party')).join('')}</div>`);$('#ovCard').querySelectorAll('.pm').forEach(el=>{const i=+el.dataset.i,m=D.party[i];el.querySelector('.mon').replaceWith(monIcon(m.sp,false,m.evo));const b=document.createElement('button');b.className='btn small';b.textContent='Feed';b.disabled=m.hp>=maxHP(m);
  b.onclick=()=>{D.bag[k]--;m.hp=k==='mega'?maxHP(m):Math.min(maxHP(m),m.hp+30);sfx('heal');save();back()};el.querySelector('.acts').appendChild(b)});$('#cX').onclick=back}
function openShop(){const render=()=>{showCard(head('Glorp Mart',`You have <b style="color:var(--sun)">${D.coins}</b> coins. Coins come from battles.`)+`<div class="shop">${Object.keys(ITEMS).map(k=>`<div class="si" data-k="${k}"><span class="ic"></span><div><b>${ITEMS[k].n}</b><small>${ITEMS[k].d} You have ${D.bag[k]||0}.</small></div><button class="btn small" ${D.coins<ITEMS[k].p?'disabled':''}>Buy · ${ITEMS[k].p}</button></div>`).join('')}</div>`);
  $('#ovCard').querySelectorAll('.si').forEach(el=>{const k=el.dataset.k;el.querySelector('.ic').replaceWith(itemIcon(k));el.querySelector('button').onclick=()=>{if(D.coins<ITEMS[k].p)return;D.coins-=ITEMS[k].p;D.bag[k]=(D.bag[k]||0)+1;sfx('buy');hud();save();render()}});$('#cX').onclick=closeCard};render()}
function subjReport(subj){const E=ENG[subj].E(),items=subj==='math'?MSK:FEATS,f=focusOf(subj),acc=E.q?Math.round(E.ok/E.q*100):0;
  const row=(x,i)=>{const m=E.m[i],cls=m>=MASTER?'m':(i===f||E.n[i])?'w':'n',lab=m>=MASTER?'Strong':i===f?'Working on':E.n[i]?'Practicing':'Not yet';return`<div class="feat"><b>${esc(x.n)}${subj==='math'?`<span class="gr">grade ${x.g}</span>`:''}</b><span class="tg ${cls}">${lab}</span><div class="bar"><i style="width:${Math.round(m*100)}%"></i></div><small>${E.c[i]} of ${E.n[i]} right</small></div>`};
  const missed=Object.entries(E.missed).sort((a,b)=>b[1]-a[1]).slice(0,16).map(([w])=>w);const pl=E.placement;
  return`<div class="res"><div><small>Working on</small><b>${E.placed?esc(items[f].n):'Scan not done'}</b></div><div><small>${subj==='math'?'Grade level of that skill':'Spelling stage'}</small><b>${E.placed?(subj==='math'?esc(items[f].g):['Letter Name','Within Word Pattern','Syllables and Affixes'][FEATS[f].st]):'—'}</b></div><div><small>Answered · accuracy</small><b>${E.q} · ${acc}%</b></div></div>
   ${pl?`<p class="sub">Last scan ${pl.date}: ${pl.correct} of ${pl.q} right.</p>`:''}${items.map(row).join('')}<div class="sh">To practice</div><div class="words">${missed.length?missed.map(w=>`<span>${esc(w)}</span>`).join(''):'<span style="border-color:var(--line)">None yet</span>'}</div>`}
function openReport(tab){tab=tab||'spell';const days=Object.entries(D.days).sort((a,b)=>b[0].localeCompare(a[0]));const mins=Math.round(days.reduce((a,[,d])=>a+d.sec,0)/60);
  const log=`Glorp Island learning log (${D.name||'student'})\n`+days.slice(0,14).map(([d,v])=>`${d}: spelling ${v.spell.q} words (${v.spell.q?Math.round(v.spell.c/v.spell.q*100):0}%), math ${v.math.q} problems (${v.math.q?Math.round(v.math.c/v.math.q*100):0}%), ${Math.round(v.sec/60)} min`).join('\n')+
    `\nSpelling: working on ${FEATS[focusOf('spell')].n}. Math: working on ${MSK[focusOf('math')].n} (grade ${MSK[focusOf('math')].g}).`;
  let body='';if(tab==='spell'||tab==='math')body=subjReport(tab);
  else body=`<div class="res"><div><small>Total time playing</small><b>${mins} min</b></div><div><small>Glorps caught</small><b>${DEX.filter(k=>D.dex.caught[k]).length} of ${DEX.length}</b></div><div><small>Badges</small><b>${['fizz','cheese','champ'].filter(k=>D.badges[k]).length} of 3</b></div></div>
    <div class="sh">Portfolio log</div><textarea class="log" id="logTxt" readonly>${esc(log)}</textarea><div class="center" style="margin-top:10px"><button class="btn small" id="cpy">Copy log</button></div>
    <p class="sub" style="margin-top:12px;font-size:15px">How it adapts: the Brain Scan and Number Scan find the first spelling pattern and the first math skill he hasn't mastered. In battles, most questions come from that skill; some review earlier ones or preview the next. Missed ones come back a few questions later and must be answered right twice. Spelling forgives one obvious typo per word.</p>`;
  showCard(head('Grown-ups report',`${esc(D.name||'Your trainer')} · ${cloud.ok?'saved online':'saved on this device only'}`)+`<div class="tabs" role="tablist">${[['spell','Spelling'],['math','Math'],['prog','Progress & log']].map(([k,n])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-t="${k}">${n}</button>`).join('')}</div>${body}`);
  $('#ovCard').querySelectorAll('.tab').forEach(b=>b.onclick=()=>openReport(b.dataset.t));$('#cX').onclick=closeCard;
  const cp=$('#cpy');if(cp)cp.onclick=e=>{const ta=$('#logTxt');try{navigator.clipboard.writeText(ta.value).then(()=>e.target.textContent='Copied',()=>ta.select())}catch(_){ta.select()}}}
$('#partyBtn').onclick=()=>{audioInit();if(mode==='world')openParty()};$('#dexBtn').onclick=()=>{if(mode==='world')openDex()};$('#bagBtn').onclick=()=>{if(mode==='world')openBag()};
$('#repBtn').onclick=()=>{if(mode==='world'||mode==='title')openReport()};$('#titleRep').onclick=()=>openReport();
$('#sndBtn').onclick=()=>{D.sound=!D.sound;audioInit();applyVol();$('#sndWave').style.display=D.sound?'':'none';save()};

/* ===================== input ===================== */
const KMAP={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
addEventListener('keydown',e=>{if(document.activeElement===$('#nameIn'))return;const k=e.key.toLowerCase();audioInit();
  if(SQ){if(k==='backspace'){e.preventDefault();typeKey('back')}else if(k==='enter'){e.preventDefault();typeKey('enter')}else if(/^[a-z0-9]$/.test(k)&&!e.metaKey&&!e.ctrlKey)typeKey(k);return}
  if(B&&(k===' '||k==='enter')){e.preventDefault();if(M.res){if(M.shown<M.full.length)M.shown=M.full.length;else M.hold=0}return}
  if(k.startsWith('arrow')||k===' ')e.preventDefault();if(k==='shift')P.run=true;
  if(mode==='dialog'&&(k===' '||k==='enter'||k==='z')){dlgAdvance();return}
  if(mode==='world'){if(KMAP[k])held[KMAP[k]]=true;if(k===' '||k==='enter'||k==='z')actionQ=true;if(k==='g')openParty();if(k==='i')openBag()}
  if(mode==='menu'&&k==='escape'&&$('#cX'))$('#cX').click()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KMAP[k])held[KMAP[k]]=false;if(k==='shift')P.run=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false;P.run=false});
document.querySelectorAll('.dpad button').forEach(b=>{const d=b.dataset.d;const on=e=>{e.preventDefault();audioInit();held[d]=true;b.classList.add('down')};const off=()=>{held[d]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))});
$('#bA').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();e.currentTarget.classList.add('down');if(mode==='dialog')dlgAdvance();else if(mode==='world')actionQ=true});
$('#bB').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();e.currentTarget.classList.add('down');P.run=true;if(mode==='dialog')dlgAdvance()});
['#bA','#bB'].forEach(s=>['pointerup','pointercancel','pointerleave'].forEach(t=>$(s).addEventListener(t,()=>{$(s).classList.remove('down');if(s==='#bB')P.run=false})));

/* ===================== online save ===================== */
const cloud={ref:null,ok:false,busy:false,dirty:false,t:null};
function summary(){const sub=subj=>{const E=ENG[subj].E(),items=subj==='math'?MSK:FEATS,f=focusOf(subj);return{placed:!!E.placed,placement:E.placement,workingOn:E.placed?items[f].n:null,strong:E.m.filter(m=>m>=MASTER).length,answered:E.q,correct:E.ok,accuracy:E.q?Math.round(E.ok/E.q*100):0,
    skills:items.map((x,i)=>({skill:x.n,mastery:Math.round(E.m[i]*100),right:E.c[i],tried:E.n[i]})),missed:Object.entries(E.missed).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([w,n])=>w+' x'+n)}};
  return{spelling:sub('spell'),math:sub('math'),days:Object.entries(D.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,60).map(([d,v])=>({date:d,spelling:v.spell,math:v.math,minutes:Math.round(v.sec/60)})),
    game:{map:D.map,party:D.party.map(m=>monName(m)+' Lv'+m.lv),badges:Object.keys(D.badges),caught:DEX.filter(k=>D.dex.caught[k]).length}}}
function cloudSchedule(){if(!cloud.ok)return;cloud.dirty=true;if(!cloud.t)cloud.t=setTimeout(cloudFlush,4000)}
async function cloudFlush(){cloud.t=null;if(!cloud.ok||!cloud.dirty)return;if(cloud.busy){cloud.t=setTimeout(cloudFlush,2000);return}cloud.busy=true;cloud.dirty=false;
  try{await cloud.ref.set({name:D.name||'',updatedAt:new Date().toISOString(),summary:summary(),save:JSON.stringify(D)})}
  catch(e){const c=e&&e.code;if(['invalid_argument','revoked','not_granted','capability_disabled','quota_exceeded'].includes(c))cloud.ok=false;else cloud.dirty=true}cloud.busy=false;if(cloud.ok&&cloud.dirty)cloudSchedule()}
async function cloudInit(){try{if(!window.claude||!window.claude.use)return;const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
  cloud.ref=db.doc('players/'+id);const snap=await cloud.ref.get();if(snap.exists){const r=snap.data();if(r&&typeof r.save==='string'){try{const rs=JSON.parse(r.save);if((rs.savedAt||0)>(D.savedAt||0)&&mode==='title'){D=migrate(rs);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}applyLoaded()}}catch(e){}}}
  cloud.ok=true;if(D.started)cloudSchedule()}catch(e){cloud.ok=false}}
addEventListener('pagehide',()=>{if(D.started)save();if(cloud.ok&&cloud.dirty){clearTimeout(cloud.t);cloudFlush()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&D.started&&mode!=='title')save();if(document.hidden&&cloud.ok&&cloud.dirty){clearTimeout(cloud.t);cloudFlush()}if(AC){if(document.hidden)AC.suspend();else AC.resume()}});

/* ===================== layout & loop ===================== */
const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;document.body.classList.toggle('touch',touch);
function layout(){const app=$('#app');const W=app.clientWidth,H=app.clientHeight;const cons=B?(H<640?360:410):(touch?180:34);
  let w=Math.min(W,(H-cons-56)*4/3);w=Math.max(220,Math.floor(w));const sc=$('#screen');sc.style.width=w+'px';sc.style.height=Math.floor(w*.75)+'px';const u=w/256;document.documentElement.style.setProperty('--u',u);document.documentElement.style.setProperty('--fs',clamp(u*7,16,21)+'px');
  bmsg.style.display=(B&&!bq.hidden)?'none':''}
addEventListener('resize',layout);
let last=performance.now(),activeT=0;['pointerdown','keydown'].forEach(t=>addEventListener(t,()=>activeT=60,true));
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;
  try{if(mode==='world'||mode==='dialog'){if(MAPX)updateWorld(dt)}
    if(mode==='fade'){if(fade.phase==='out'){fade.a+=dt*4;if(fade.a>=1){fade.a=1;fade.phase='in';const cb=fade.cb;fade.cb=null;cb&&cb()}}else if(fade.phase==='in'){fade.a-=dt*4;if(fade.a<=0){fade.a=0;fade.phase='';mode='world'}}}
    if(exclaim)exclaim.t+=dt;
    if(mode==='dialog'&&DLG.cur&&DLG.shown<DLG.full.length){const b=DLG.shown|0;DLG.shown=Math.min(DLG.full.length,DLG.shown+dt*55);if((DLG.shown|0)!==b&&b%3===0)sfx('blip');renderDlg()}
    if(M.res){if(M.shown<M.full.length){M.shown=Math.min(M.full.length,M.shown+dt*65);bmsg.textContent=M.full.slice(0,M.shown|0)}else{M.hold-=dt;if(M.hold<=0){const r=M.res;M.res=null;r()}}}
    if(B){const f=B.fx;if(f.fF>0)f.fF-=dt;if(f.mF>0)f.mF-=dt}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt}
    if(shake>0)shake=Math.max(0,shake-dt*12);if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').hidden=true}if(duck>0){duck-=dt;if(duck<=0)applyVol()}
    if(activeT>0&&!document.hidden&&mode!=='title'){activeT-=dt;dayStat().sec+=dt}
    ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
    if(B)drawBattle();else if(MAPX)drawWorld();
    if(mode==='title'&&MAPX){cam.x=(Math.sin(now*.15)*.5+.5)*(MAPX.w*16-VW);cam.y=(Math.cos(now*.1)*.5+.5)*Math.max(0,MAPX.h*16-VH)}
    musicTick()}catch(e){console.error(e)}requestAnimationFrame(frame)}

/* ===================== boot ===================== */
function applyLoaded(){$('#nameIn').value=D.name||'';const st=!!D.started;$('#contBtn').hidden=!st;$('#namebox').hidden=st;$('#saveInfo').hidden=!st;
  if(st){const badges=['fizz','cheese','champ'].filter(k=>D.badges[k]).length;$('#contBtn').innerHTML=`Continue <small style="display:block;font-size:14px;font-weight:600;opacity:.85">${esc(D.name||'Trainer')} · ${D.party.length+D.box.length} Glorps · ${badges} badge${badges===1?'':'s'}</small>`;
    $('#saveInfo').textContent='Your game saves automatically after every move, battle and catch.'}
  $('#goBtn').textContent=st?'Start over':'New game';$('#goBtn').className=st?'btn ghost small':'btn';$('#sndWave').style.display=D.sound?'':'none';hud()}
function begin(isNew){audioInit();if(isNew&&D.started){confirmRestart();return}
  if(isNew){const nm=$('#nameIn').value.trim().slice(0,12);const keep=D.sound;D=fresh();D.sound=keep;D.name=nm||'Trainer';D.started=true;save()}
  enterGame()}
function confirmRestart(){showCard(`<h2>Start over?</h2><p>This erases <b>${esc(D.name||'this trainer')}'s</b> Glorps, badges, items and map progress. It can't be undone.</p><p class="sub">Spelling and math progress is kept, so the questions stay at the right level.</p>
   <div class="namebox"><label for="nameIn2">New trainer name</label><input id="nameIn2" maxlength="12" placeholder="Trainer" autocomplete="off" value="${esc(D.name||'')}"></div>
   <div class="center"><button class="btn ghost" id="rsNo">Keep my game</button><button class="btn" id="rsYes" style="background:var(--rose);box-shadow:0 4px 0 #A3324A;color:#3A0A16">Yes, erase and start over</button></div>`);
  $('#rsNo').onclick=closeCard;$('#rsYes').onclick=()=>{const nm=$('#nameIn2').value.trim().slice(0,12);const keep={sp:D.sp,ma:D.ma,days:D.days,sound:D.sound};D=fresh();Object.assign(D,keep);D.name=nm||'Trainer';D.started=true;save();$('#ov').hidden=true;enterGame()}}
function enterGame(){$('#titleOv').hidden=true;loadMap(D.map||'town1');P.x=D.pos.x;P.y=D.pos.y;P.dir=D.pos.dir||'down';P.moving=false;mode='world';setMusic(MAPX.W.music);areaName(MAPX.W.name);hud();layout();
  const needProf=!D.sp.placed||!D.ma.placed||D.sp.survey||D.ma.survey||D.flags.needNews||!D.party.length;if(needProf)setTimeout(()=>{if(mode==='world'){if(MAPX.id==='town1'){const p=npcAt(9,7);if(p)faceNpc(p)}TALK.prof()}},600)}
$('#goBtn').onclick=()=>begin(true);$('#contBtn').onclick=()=>begin(false);$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')begin(!D.started)});
['field'].forEach(buildTheme);load();applyLoaded();loadMap('town1');mode='title';cloudInit();layout();requestAnimationFrame(frame);
window.__g={get D(){return D},get B(){return B},get mode(){return mode},get SQ(){return SQ},get MAPX(){return MAPX},P,typeKey,submitQ,startBattle,mkMon,dlgAdvance,held,goMap,TALK,get M(){return M},openParty,openDex,openBag,openShop,openReport,checkTrainers,nextQ,genMath,surveyStart,loadMap,WORLD,
  set mode(v){mode=v}};

})();
