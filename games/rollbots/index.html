<!doctype html>
<html lang="en"><head>
<script src="../_kid.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roll Bots</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#F3F6FF;--gold:#FFD23F;--cy:#38E8FF;--pk:#FF4FA3;--bad:#FF5A5A;--good:#3EE68A;--hud:'Russo One',Impact,sans-serif;--ui:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0B0F24;color:var(--ink);font:800 16px var(--ui);touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.btn{font:400 20px var(--hud);letter-spacing:.03em;border:0;border-radius:16px;padding:14px 24px;color:#1A1300;background:linear-gradient(180deg,#FFE27A,#FFC21F);box-shadow:0 6px 0 #B5840A,0 10px 24px rgba(0,0,0,.35);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B5840A}
.btn.alt{background:linear-gradient(180deg,#4B5BD6,#3443B0);color:#fff;box-shadow:0 6px 0 #1E2873}
.btn.sm{font-size:15px;padding:9px 14px;border-radius:12px}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#timer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);text-align:center;font:400 34px var(--hud);text-shadow:0 3px 0 rgba(0,0,0,.5)}
#timer small{display:block;font:900 12px var(--ui);letter-spacing:.2em;color:#C9D2FF}
#timer.warn{color:#FF6B6B;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
#me{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:rgba(10,14,40,.72);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 12px;min-width:200px}
#me .row{display:flex;align-items:center;gap:8px}
#coins{font:400 26px var(--hud);color:var(--gold)}
#hpb{height:12px;border-radius:9px;background:#2A1530;overflow:hidden;margin-top:6px;border:2px solid #000}
#hpb i{display:block;height:100%;background:linear-gradient(90deg,#3EE68A,#B6FF5A);transition:width .15s}
#pw{font-size:12px;color:#C9D2FF;margin-top:4px;min-height:15px}
#board{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 150px);background:rgba(10,14,40,.72);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 8px;font-size:13px;min-width:170px}
#board div{display:flex;justify-content:space-between;gap:10px;padding:2px 4px;border-radius:6px}
#board .you{background:rgba(255,210,63,.25);color:#FFE27A}
#board .cut{border-top:2px dashed #FF5A5A;margin-top:3px;padding-top:4px}
#board .out{opacity:.45}
#mini{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:132px;height:132px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(10,14,40,.6)}
#banner{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);text-align:center;font:400 54px var(--hud);text-shadow:0 5px 0 rgba(0,0,0,.45);white-space:nowrap;transition:opacity .3s}
#banner small{display:block;font:900 20px var(--ui);color:#FFE27A;text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:normal;max-width:90vw}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(10,14,40,.85);border:2px solid var(--gold);border-radius:14px;padding:8px 16px;font-size:16px;max-width:86vw;text-align:center;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#arrow{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;font-size:30px;line-height:40px;text-align:center;filter:drop-shadow(0 2px 2px #000)}
/* touch controls */
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55)}
#morph{pointer-events:auto;position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#7FF5FF,#1E8FD6);font:400 13px var(--hud);color:#fff;text-shadow:0 2px 0 #000;box-shadow:0 6px 0 #0B4A7A,0 10px 30px rgba(0,0,0,.4)}
#morph b{display:block;font-size:34px;line-height:1}
#morph.cd{filter:grayscale(1) brightness(.6)}
#keys{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);font-size:12px;color:#AAB4E8;opacity:.85}
/* screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 20%,rgba(56,232,255,.18),transparent 60%),rgba(8,10,30,.86);overflow:auto}
.panel{width:min(780px,100%);background:linear-gradient(180deg,#1B2257,#121741);border:3px solid #3A47A8;border-radius:26px;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.logo{font:400 clamp(44px,9vw,84px)/0.95 var(--hud);text-align:center;background:linear-gradient(180deg,#FFF,#7FF5FF 45%,#1E8FD6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #0B2A6B);margin:4px 0 6px}
.tag{text-align:center;color:#C9D2FF;margin:0 0 14px}
h2{font:400 26px var(--hud);margin:0 0 10px;color:#FFE27A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#232C6E;border:3px solid #3A47A8;border-radius:18px;padding:12px;text-align:center;cursor:pointer;position:relative}
.card.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.35)}
.card.lock{opacity:.45;cursor:default}
.card b{display:block;font:400 17px var(--hud);margin:4px 0}
.card small{color:#C9D2FF;font-size:12.5px;display:block}
.card .em{font-size:38px}
.card.dead{filter:grayscale(1);opacity:.4;cursor:default}
.rar{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;margin-top:4px}
.r0{background:#5A6378}.r1{background:#2B7BE0}.r2{background:#8E3BD6}.r3{background:linear-gradient(90deg,#FF9F1C,#FFD23F);color:#2A1E00}
.paints{display:flex;flex-wrap:wrap;gap:8px}
.paint{width:40px;height:40px;border-radius:12px;border:3px solid rgba(255,255,255,.2);cursor:pointer}
.paint.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.paint.lock{opacity:.3;cursor:default}
.statbar{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;color:#C9D2FF;margin:8px 0 14px}
.statbar b{color:#fff}
.center{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res td{padding:5px 8px;border-bottom:1px solid #2A347A}
table.res tr.you td{color:#FFE27A}
table.res tr.out td{color:#FF8A8A}
/* question */
#qv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,25,.8);padding:14px;z-index:20}
#qbox{width:min(640px,100%);background:linear-gradient(180deg,#1F2A6E,#141B4C);border:4px solid var(--cy);border-radius:26px;padding:18px;text-align:center;box-shadow:0 0 60px rgba(56,232,255,.35)}
#qtitle{font:400 18px var(--hud);color:var(--cy);letter-spacing:.06em}
#qsub{color:#C9D2FF;font-size:14px;margin:2px 0 8px}
#qtext{font:900 clamp(30px,7vw,52px) var(--ui);margin:6px 0 10px;color:#fff}
#qread{height:8px;border-radius:9px;background:#0B1033;overflow:hidden;margin:0 auto 12px;max-width:340px}
#qread i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),#B6FF5A)}
#qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#qopts button{font:900 clamp(24px,5.5vw,36px) var(--ui);padding:16px 8px;border-radius:18px;border:3px solid #3A47A8;background:#2A3590;color:#fff;cursor:pointer;box-shadow:0 5px 0 #141B4C}
#qopts button:disabled{opacity:.45;cursor:default}
#qopts button.ok{background:#1E9E5A;border-color:#3EE68A}
#qopts button.no{background:#9E1E3A;border-color:#FF5A5A}
#qfb{min-height:24px;margin-top:12px;font-size:17px}
#qfb .work{display:block;margin-top:6px;color:#FFE27A;font-size:16px;white-space:pre-line}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:400 28px var(--hud);color:#7FF5FF;background:#0B0F24}
@media (max-width:640px){#board{top:auto;bottom:140px;right:8px;font-size:11.5px;min-width:140px}#mini{width:100px;height:100px}#me{min-width:160px}#banner{font-size:36px}}
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="load">Building robots…</div>
<div id="hud" hidden>
 <div id="timer">1:00<small>ROUND 1</small></div>
 <div id="me"><div class="row"><span style="font-size:24px">🪙</span><span id="coins">0</span><span style="margin-left:auto;font-size:13px;color:#C9D2FF" id="place">#1</span></div><div id="hpb"><i style="width:100%"></i></div><div id="pw"></div></div>
 <canvas id="mini" width="264" height="264"></canvas>
 <div id="board"></div>
 <div id="banner"></div>
 <div id="toast"></div>
 <div id="arrow" hidden>⚡</div>
 <div id="joy" hidden><i></i></div>
 <button id="morph"><b>⚪</b>ROLL</button>
 <div id="keys">Move: WASD / arrows · Roll into a marble: SPACE · Your bot shoots by itself</div>
</div>
<div id="title" class="scr" hidden></div>
<div id="lab" class="scr" hidden></div>
<div id="res" class="scr" hidden></div>
<div id="qv" hidden><div id="qbox"><div id="qtitle"></div><div id="qsub"></div><div id="qtext"></div><div id="qread"><i></i></div><div id="qopts"></div><div id="qfb"></div></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const KID=window.__KID||'',YOUNG=!!(window.__young&&__young());
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!window.THREE){$('#load').textContent='Could not load the 3D engine. Check the internet and reload.';return}

/* ======================= save ======================= */
const SKEY='rollbots.v1';
const WEAPONS={blaster:{n:'Zap Blaster',em:'🔫',lv:1,dmg:9,rate:5,range:16,spd:42,d:'Steady shots. Good at everything.'},
 minigun:{n:'Buzz Minigun',em:'🌀',lv:2,dmg:4.2,rate:13,range:15,spd:46,spread:.12,slow:.25,d:'Super fast bullets that slow enemies down.'},
 shotgun:{n:'Boom Blunderbuss',em:'💥',lv:3,dmg:7,rate:1.4,range:9.5,spd:38,pellets:6,spread:.32,d:'Six pellets at once. Get close!'},
 rockets:{n:'Rocket Pack',em:'🚀',lv:5,dmg:30,rate:.95,range:20,spd:24,aoe:4.2,d:'Slow rockets that blow up everything nearby.'},
 laser:{n:'Laser Lance',em:'⚡',lv:8,dmg:17,rate:2.4,range:23,beam:true,d:'Instant beam with the longest reach.'}};
const WORDER=['blaster','minigun','shotgun','rockets','laser'];
const PAINTS=[['#FF4F4F','Fire Red',1],['#3E8BFF','Ocean Blue',1],['#3EE68A','Slime Green',1],['#FFD23F','Banana',1],['#B45CFF','Grape',2],['#FF8A1F','Tangerine',3],['#FF4FA3','Bubblegum',4],['#1FD6C8','Mint',5],['#E8ECF5','Chrome',6],['#2A2F45','Stealth',7],['#9AE62E','Lime',8],['#7A4A22','Chocolate',9],['#00B3FF','Neon Sky',10],['#FF2E63','Ruby',12],['#C9A227','Gold',15],['#FFFFFF','Ghost',18]];
const RAR=['Common','Rare','Epic','Legendary'];
function freshSave(){return{v:1,lvl:1,xp:0,gears:0,wl:{blaster:1},sel:'blaster',paint:'#3E8BFF',m:[],n:[],placed:false,matches:0,wins:0,best:99,q:0,ok:0,lockUntil:0}}
let S=freshSave();try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&s.v===1)S=Object.assign(freshSave(),s)}catch(e){}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
const xpNeed=L=>120+L*80;
const rarOf=l=>l>=10?3:l>=7?2:l>=4?1:0;

/* ======================= math that adapts ======================= */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function near(ans,extra){const s=new Set([ans]);const c=(extra||[]).concat([ans+1,ans-1,ans+10,ans-10,ans+2,ans-2]);for(const v of c){if(s.size>=4)break;if(v>=0&&!s.has(v))s.add(v)}while(s.size<4)s.add(ans+ri(3,12));return[...s].sort(()=>rnd()-.5)}
const SK=[
 {n:'Add within 10',g:()=>{const a=ri(1,8),b=ri(1,10-a);return{t:`${a} + ${b}`,a:a+b,w:`Start at ${a}, count up ${b}: ${a+b}.`}}},
 {n:'Take away within 10',g:()=>{const a=ri(4,10),b=ri(1,a-1);return{t:`${a} − ${b}`,a:a-b,w:`Start at ${a}, count back ${b}: ${a-b}.`}}},
 {n:'Add within 20',g:()=>{const a=ri(5,12),b=ri(3,9);return{t:`${a} + ${b}`,a:a+b,w:`Make a ten: ${a} + ${10-a%10>0&&a<10?10-a:0} … ${a} + ${b} = ${a+b}.`.replace(/Make a ten:.*… /,'')}}},
 {n:'Take away within 20',g:()=>{const a=ri(11,19),b=ri(3,9);return{t:`${a} − ${b}`,a:a-b,w:`${a} − ${a-10} = 10, then take ${b-(a-10)} more: ${a-b}.`.replace(/then take -?\d+ more/,'then keep going')}}},
 {n:'2-digit add',g:()=>{const a=ri(11,59),b=ri(11,39);const s=a+b;return{t:`${a} + ${b}`,a:s,w:`Tens: ${Math.floor(a/10)*10} + ${Math.floor(b/10)*10} = ${Math.floor(a/10)*10+Math.floor(b/10)*10}. Ones: ${a%10} + ${b%10} = ${a%10+b%10}. Together: ${s}.`,x:[s+10,s-10,s+1]}}},
 {n:'2-digit take away',g:()=>{let a=ri(40,98),b=ri(12,a-10);const d=a-b;return{t:`${a} − ${b}`,a:d,w:`Take away the tens: ${a} − ${Math.floor(b/10)*10} = ${a-Math.floor(b/10)*10}. Then the ones: − ${b%10} = ${d}.`,x:[d+10,d-10,Math.abs(Math.floor(a/10)-Math.floor(b/10))*10+Math.abs(a%10-b%10)]}}},
 {n:'Times 2, 5, 10',g:()=>{const a=pick([2,5,10]),b=ri(2,10);return{t:`${a} × ${b}`,a:a*b,w:`${b} groups of ${a}: count by ${a}s ${b} times = ${a*b}.`,x:[a*b+a,a*b-a,a+b]}}},
 {n:'Times 3 and 4',g:()=>{const a=pick([3,4]),b=ri(2,10);return{t:`${a} × ${b}`,a:a*b,w:`${a} × ${b}: double ${a===4?'and double again':'it, then add one more '+b}: ${a*b}.`,x:[a*b+a,a*b-a,a*b+b]}}},
 {n:'Times 6 to 9',g:()=>{const a=ri(6,9),b=ri(3,9);return{t:`${a} × ${b}`,a:a*b,w:`${a} × ${b} = ${a} × ${b-1} + ${a} = ${a*(b-1)} + ${a} = ${a*b}.`,x:[a*b+a,a*b-a,a*b+b,a*b-b]}}},
 {n:'Sharing (division)',g:()=>{const b=ri(2,9),q=ri(2,10);return{t:`${b*q} ÷ ${b}`,a:q,w:`What times ${b} makes ${b*q}? ${b} × ${q} = ${b*q}, so the answer is ${q}.`,x:[q+1,q-1,b]}}},
 {n:'3-digit add',g:()=>{const a=ri(120,580),b=ri(110,399),s=a+b;return{t:`${a} + ${b}`,a:s,w:`Hundreds, tens, ones: ${Math.floor(a/100)*100}+${Math.floor(b/100)*100}, ${(Math.floor(a/10)%10)*10}+${(Math.floor(b/10)%10)*10}, ${a%10}+${b%10}. Add them up (carry when a column is 10 or more): ${s}.`,x:[s+100,s-100,s+10,s-10]}}},
 {n:'3-digit take away',g:()=>{const a=ri(310,950),b=ri(120,a-60),d=a-b;return{t:`${a} − ${b}`,a:d,w:`Count up from ${b}: to ${Math.ceil(b/100)*100} is ${Math.ceil(b/100)*100-b}, to ${Math.floor(a/100)*100} is ${Math.floor(a/100)*100-Math.ceil(b/100)*100}, to ${a} is ${a-Math.floor(a/100)*100}. Total: ${d}.`,x:[d+100,d-100,d+10,d-10]}}},
 {n:'Fraction of a number',g:()=>{const den=pick([2,3,4,5]),q=ri(2,9),n=den*q;return{t:`1/${den} of ${n}`,a:q,w:`Split ${n} into ${den} equal groups: ${n} ÷ ${den} = ${q}.`,x:[q+1,q-1,n-den]}}},
 {n:'Big times',g:()=>{const a=ri(12,49),b=ri(3,8),p=a*b;return{t:`${a} × ${b}`,a:p,w:`${Math.floor(a/10)*10} × ${b} = ${Math.floor(a/10)*10*b}, ${a%10} × ${b} = ${a%10*b}. Add: ${p}.`,x:[p+b,p-b,p+10,p-10]}}}];
const MAST=.8;
(function initEng(){while(S.m.length<SK.length){S.m.push(0);S.n.push(0)}if(!S.placed){const start=YOUNG?0:KID==='jack'?6:KID==='vinny'?4:3;for(let i=0;i<start;i++){S.m[i]=.9;S.n[i]=3}S.placed=true;save()}})();
const focusSk=()=>{for(let i=0;i<SK.length;i++)if(S.m[i]<MAST)return i;return SK.length-1};
function makeQ(kind){const f=focusSk();let s=f;const r=rnd();if(kind==='hard')s=Math.min(SK.length-1,f+1);else if(r<.18&&f>0)s=ri(Math.max(0,f-3),f-1);else if(r>.9&&f<SK.length-1)s=f+1;
 const g=SK[s].g();return{s,text:g.t,ans:g.a,work:g.w,opts:near(g.a,g.x)}}
function gradeQ(q,ok){S.q++;if(ok)S.ok++;S.n[q.s]++;if(ok)S.m[q.s]+=(1-S.m[q.s])*.3;else S.m[q.s]*=.75;save();try{window.__trk&&__trk.ans({s:'ma',f:q.s,it:q.text,ok})}catch(e){}}

/* ---- the question card: read first, no guessing ---- */
let qOpen=false;
function speak(t){try{if(!YOUNG||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace('−',' minus ').replace('×',' times ').replace('÷',' divided by ').replace(/1\/(\d)/,'one out of $1 parts')) ;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function ask(q,title,sub){window.__rbq=q;return new Promise(res=>{qOpen=true;paused=true;$('#qv').hidden=false;$('#qtitle').textContent=title;$('#qsub').textContent=sub||'';$('#qtext').textContent=q.text+' = ?';$('#qfb').innerHTML='';
 const box=$('#qopts');box.innerHTML='';const words=q.text.split(/\s+/).length;const readMs=YOUNG?2600:Math.min(3500,900+words*380);const bar=$('#qread i');bar.style.transition='none';bar.style.width='0';void bar.offsetWidth;bar.style.transition=`width ${readMs}ms linear`;bar.style.width='100%';
 speak(q.text);let done=false;
 q.opts.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.disabled=true;b.onclick=()=>{if(done)return;done=true;const ok=v===q.ans;gradeQ(q,ok);
   box.querySelectorAll('button').forEach(x=>{x.disabled=true;if(+x.textContent===q.ans)x.classList.add('ok')});if(!ok)b.classList.add('no');
   if(ok){sfx('good');$('#qfb').innerHTML=`<b style="color:#3EE68A">${pick(['Correct!','Nailed it!','Bot brain: 100%!','Boom! Right!'])}</b>`;setTimeout(close,850)}
   else{sfx('bad');$('#qfb').innerHTML=`<b style="color:#FF8A8A">Not this time.</b> The answer is <b>${q.ans}</b>.<span class="work">${esc(q.work)}</span><div class="center" style="margin-top:10px"><button class="btn sm" id="qgo" disabled>Got it</button></div>`;
    const g=$('#qgo');setTimeout(()=>{g.disabled=false},2600);g.onclick=close}
   function close(){$('#qv').hidden=true;qOpen=false;paused=false;last=performance.now();res(ok)}};box.appendChild(b)});
 setTimeout(()=>{if(!done)box.querySelectorAll('button').forEach(x=>x.disabled=false)},readMs)})}

/* ======================= audio ======================= */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
let sfxN=0;

function blocked(x,z,r){if(Math.abs(x)>HALF-r||Math.abs(z)>HALF-r)return true;const g=regionOf(x,z);if(g>=0&&closed.has(g))return true;

function losClear(ax,az,bx,bz){const d=Math.hypot(bx-ax,bz-az),n=Math.ceil(d/1.2);for(let i=1;i<n;i++){const t=i/n,x=ax+(bx-ax)*t,z=az+(bz-az)*t;for(const o of OBST){if(o.reg>=0&&closed.has(o.reg))continue;if(o.r?Math.hypot(x-o.x,z-o.z)<o.r*.8:(Math.abs(x-o.x)<o.hw&&Math.abs(z-o.z)<o.hd))return false}}return true}

function nearestEnemy(p,range){let best=null,bd=range;for(const t of P){if(t===p||t.dead||t.out)continue;const d=Math.hypot(t.x-p.x,t.z-p.z);if(d<bd&&losClear(p.x,p.z,t.x,t.z)){bd=d;best=t}}return best}
function botThink(p,dt){const A=p.ai;A.t-=dt;
 const low=p.hp<p.maxHp*.35;if(low&&!p.marble&&p.morphCd<=0&&rnd()<.6)tryMorph(p);if(p.marble&&p.hp>p.maxHp*.85&&p.morphCd<=0)tryMorph(p);

  let goal=null,bs=-1e9;
  for(const c of COINS){const d=Math.hypot(c.x-p.x,c.z-p.z);const s=c.val*12-d;if(s>bs){bs=s;goal={x:c.x,z:c.z}}}
  for(const c of CORES){const d=Math.hypot(c.x-p.x,c.z-p.z);const s=30-d;if(s>bs){bs=s;goal={x:c.x,z:c.z}}}
  if(!low&&!p.marble)for(const t of P){if(t===p||t.dead||t.out)continue;const d=Math.hypot(t.x-p.x,t.z-p.z);const s=t.coins*2.2+(t.me?4:0)-d*.9-(t.hp/t.maxHp)*8;if(s>bs&&d<30){bs=s;goal={x:t.x,z:t.z,t}}}
  if(pendingClose>=0&&regionOf(p.x,p.z)===pendingClose)goal={x:0,z:0};
  A.goal=goal||{x:ri(-30,30),z:ri(-30,30)}}
 const g=A.goal;let dx=g.x-p.x,dz=g.z-p.z;const d=Math.hypot(dx,dz)||1;
 if(g.t&&d<p.w.range*.6&&!p.marble){const s=Math.sin(performance.now()/600+p.x);dx=-dz/d*s*3;dz=dx/d*s*3}
 const sp=(p.marble?14.5:9)*(p.slow>0?.6:1)*(1+round*.04);let mx=dx/d,mz=dz/d;
 /* steer around cover */
 const ahead=1.8;if(blocked(p.x+mx*ahead,p.z+mz*ahead,1.15)){const L=blocked(p.x+(mx*.7-mz*.7)*ahead,p.z+(mz*.7+mx*.7)*ahead,1.15);[mx,mz]=L?[mx*.3+mz,mz*.3-mx]:[mx*.3-mz,mz*.3+mx]}
 if(d>1){p.vx+=(mx*sp-p.vx)*Math.min(1,dt*6);p.vz+=(mz*sp-p.vz)*Math.min(1,dt*6)}else{p.vx*=.8;p.vz*=.8}}

let hitFlash=0,camX=0,camZ=20;
function tick(dt){
 if(state==='play'){roundT-=dt;
  if(round>0&&pendingClose>=0&&performance.now()>closeAt)collapse(pendingClose);
  coinT-=dt;if(coinT<=0){coinT=.55-round*.06;const open=SPOTS.filter(s=>s.reg<0||!closed.has(s.reg));const s=pick(open);if(!COINS.some(c=>Math.hypot(c.x-s.x,c.z-s.z)<1)&&COINS.length<70)addCoin(s.x,s.z,rnd()<.12?5:1)}
  coreT-=dt;if(coreT<=0&&CORES.length<1){coreT=16+rnd()*6;addCore()}
  if(roundT<=0){endRound();return}}
 if(state!=='play'&&state!=='count')return;
 for(const p of P){if(p.out)continue;
  if(p.dead){if(state==='play'){p.respawn-=dt;if(p.respawn<=0){const s=spawnPos();p.x=s.x;p.z=s.z;p.dead=false;p.hp=p.maxHp;p.marble=false;setMarble(p,false,true);p.v.root.visible=true;flash(p.x,1.5,p.z,0x7FF5FF,6,.4)}}continue}
  p.morphCd-=dt;p.fireCd-=dt;p.slow-=dt;p.morphT=Math.max(0,p.morphT-dt);for(const k in p.pw)p.pw[k]-=dt;
  if(state!=='play'){p.vx=p.vz=0}
  else if(p.me){let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.dx,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.dy;const L=Math.hypot(ix,iz);if(L>1){ix/=L;iz/=L}
   const sp=(p.marble?15:9.5)*lab.spd*(p.slow>0?.6:1);const acc=p.marble?3.2:12;p.vx+=(ix*sp-p.vx)*Math.min(1,dt*acc);p.vz+=(iz*sp-p.vz)*Math.min(1,dt*acc)}
  else botThink(p,dt);
  moveUnit(p,p.vx*dt,p.vz*dt);
  if(p.marble){p.hp=Math.min(p.maxHp,p.hp+dt*(9*(p.me?lab.regen:1)));const sp=Math.hypot(p.vx,p.vz);if(sp>.1){const ax=new THREE.Vector3(p.vz,0,-p.vx).normalize();p.v.ball.rotateOnWorldAxis(ax,sp*dt/1.15)}
   if(p.me&&lab.spiky)for(const t of P){if(t===p||t.dead||t.out)continue;if(Math.hypot(t.x-p.x,t.z-p.z)<2.4&&(t.spikeT||0)<=0){t.spikeT=.5;damage(t,12,p);spark(t.x,1.2,t.z,0x7FF5FF,6,6,.5,.3)}}}
  else{p.hp=Math.min(p.maxHp,p.hp+dt*1.2);const tgt=state==='play'?nearestEnemy(p,p.w.range):null;
   if(tgt){p.aim=Math.atan2(tgt.x-p.x,tgt.z-p.z);if(p.fireCd<=0){p.fireCd=1/(p.w.rate*(p.me?lab.rate:1));fire(p,tgt)}}
   else{const sp=Math.hypot(p.vx,p.vz);if(sp>.5)p.aim=Math.atan2(p.vx,p.vz)}}
  for(const t of P)if(t.spikeT>0)t.spikeT-=dt/ P.length;
  /* coins */
  const mag=(p.pw.magnet>0?9:2)*(p.me?lab.mag:1);
  for(let i=COINS.length-1;i>=0;i--){const c=COINS[i];if(c.vy||c.t<.35)continue;const d=Math.hypot(c.x-p.x,c.z-p.z);if(d<mag&&d>1.4){c.x+=(p.x-c.x)/d*dt*18;c.z+=(p.z-c.z)/d*dt*18}if(d<1.6){p.coins+=c.val;p.total+=c.val;if(p.me){sfx('coin');spark(c.x,1.2,c.z,0xFFD23F,5,5,.45,.35)}removeCoin(i)}}
  if(p.me)for(let i=CORES.length-1;i>=0;i--){if(Math.hypot(CORES[i].x-p.x,CORES[i].z-p.z)<2.2){hitCore(i);break}}
  else for(let i=CORES.length-1;i>=0;i--){if(Math.hypot(CORES[i].x-p.x,CORES[i].z-p.z)<2.2){const c=CORES[i];scene.remove(c.g);CORES.splice(i,1);if(rnd()<.55){const pw=pick(POWERS);if(pw.k==='jack')p.coins+=15;else p.pw[pw.k]=pw.t}break}}
  /* falling into a collapsing region */
  const rg=regionOf(p.x,p.z);if(rg>=0&&closed.has(rg)&&!p.dead){kill(p,null)}
 }
 /* unit-unit push */
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(a.out||b.out||a.dead||b.dead)continue;const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<2.3&&d>.01){const push=(2.3-d)/2;a.x-=dx/d*push;a.z-=dz/d*push;b.x+=dx/d*push;b.z+=dz/d*push}}
 bulletTick(dt);
 for(let i=COINS.length-1;i>=0;i--){const c=COINS[i];c.t+=dt;c.age+=dt;if(c.vy||c.y>1){c.vy-=22*dt;c.y+=c.vy*dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=.97;c.vz*=.97;if(blocked(c.x,c.z,.4)){c.x-=c.vx*dt*2;c.z-=c.vz*dt*2;c.vx*=-.5;c.vz*=-.5}if(c.y<=1){c.y=1;c.vy=0;c.vx=c.vz=0}}c.m.position.set(c.x,c.y+Math.sin(c.age*3+c.x)*.15,c.z);c.m.rotation.z+=dt*3}
 for(const c of CORES){c.t+=dt;c.box.rotation.y+=dt*1.6;c.box.position.y=1.8+Math.sin(c.t*2.5)*.3}
}
function animate(p,t,dt){const V=p.v;V.root.position.set(p.x,0,p.z);if(p.dead||p.out)return;
 const sp=Math.hypot(p.vx,p.vz);if(!p.marble){const mv=Math.atan2(p.vx,p.vz);if(sp>.5)p.face=lerpAng(p.face,mv,Math.min(1,dt*10));V.bot.rotation.y=p.face;V.up.rotation.y=lerpAng(V.up.rotation.y,p.aim-p.face,Math.min(1,dt*14));
  const ph=t*sp*1.3;V.legs[0].rotation.x=Math.sin(ph)*.6*Math.min(1,sp/4);V.legs[1].rotation.x=-Math.sin(ph)*.6*Math.min(1,sp/4);V.bot.position.y=Math.abs(Math.sin(ph))*.12*Math.min(1,sp/4);V.arms[0].rotation.x=-Math.sin(ph)*.5*Math.min(1,sp/4);
  V.gun.position.z+=(.35-V.gun.position.z)*Math.min(1,dt*12);V.head.rotation.z=Math.sin(t*2+p.x)*.04}
 const s=1-p.morphT/.3*.4;(p.marble?V.ball:V.bot).scale.setScalar(Math.max(.6,s));
 V.hpFg.scale.x=2.5*Math.max(0,p.hp/p.maxHp);V.hpFg.position.x=-(2.5-V.hpFg.scale.x)/2;
 V.ring.material.opacity=p.pw.shield>0?.9:p.me?.75:.35;V.ring.material.color.setHex(p.pw.over>0?0xFF5A1F:p.pw.shield>0?0x7FF5FF:p.me?0x7FF5FF:0xFF5A5A);V.vis.emissiveIntensity=p.pw.over>0?4+Math.sin(t*20)*2:2.2}
const lerpAng=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;const t=now/1000;
 if(dt>0)tick(dt);fxTick(dt);P.forEach(p=>animate(p,t,dt));
 if(me&&state!=='title'){const tx=me.x,tz=me.z;camX+=(tx-camX)*Math.min(1,dt*6||.1);camZ+=(tz-camZ)*Math.min(1,dt*6||.1);const port=innerHeight>innerWidth;const h=port?30:22,b=port?20:16.5;
  const sx=(rnd()-.5)*shake,sz=(rnd()-.5)*shake;camera.position.set(camX+sx,h,camZ+b+sz);camera.lookAt(camX,0,camZ-2);shake=Math.max(0,shake-dt*2.5);
  sun.position.set(camX+30,70,camZ+20);sun.target.position.set(camX,0,camZ)}
 else{const a=t*.08;camera.position.set(Math.sin(a)*70,42,Math.cos(a)*70);camera.lookAt(0,0,0)}
 renderer.render(scene,camera);if(state==='play'||state==='count')hud(t)}

/* ======================= HUD ======================= */
const mini=$('#mini').getContext('2d');

let hudT=0;function hud(t){hudT++;
 const m=Math.max(0,Math.ceil(roundT));$('#timer').innerHTML=`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}<small>ROUND ${round+1} OF 4</small>`;$('#timer').classList.toggle('warn',m<=10&&state==='play');
 $('#coins').textContent=me.coins;$('#hpb i').style.width=Math.max(0,me.hp/me.maxHp*100)+'%';
 const pw=[];if(me.pw.over>0)pw.push(`🔥 Overdrive ${Math.ceil(me.pw.over)}s`);if(me.pw.shield>0)pw.push(`🛡️ Shield ${Math.ceil(me.pw.shield)}s`);if(me.pw.magnet>0)pw.push(`🧲 Magnet ${Math.ceil(me.pw.magnet)}s`);if(me.marble)pw.push('⚪ Marble: healing fast, can\'t shoot');$('#pw').textContent=pw.join(' · ');
 const mb=$('#morph');mb.classList.toggle('cd',me.morphCd>0);mb.innerHTML=me.marble?'<b>🤖</b>ROBOT':'<b>⚪</b>ROLL';
 if(hudT%6===0){const R=ranked(),keep=ROUNDS[round].keep;const pos=R.indexOf(me)+1;$('#place').textContent=`#${pos} of ${R.length}`;$('#place').style.color=pos<=keep?'#3EE68A':'#FF8A8A';
  $('#board').innerHTML=R.map((p,i)=>`<div class="${p.me?'you':''}${i===keep&&keep<R.length?' cut':''}"><span>${i+1}. ${esc(p.name)}</span><b>🪙${p.coins}</b></div>`).join('')}
 /* minimap */
 const W=264,sc=W/(HALF*2);mini.clearRect(0,0,W,W);REG.forEach((R,k)=>{mini.fillStyle=closed.has(k)?'rgba(0,0,0,.6)':pendingClose===k&&Math.floor(t*4)%2?'#FF3A6A':R.c;mini.globalAlpha=.75;mini.fillRect(R.sx>0?W/2:0,R.sz>0?W/2:0,W/2,W/2)});mini.globalAlpha=1;

 /* arrow to power core */

 if(hitFlash>0){hitFlash-=.02;canvas.style.filter=`saturate(${1+hitFlash*2}) brightness(${1+hitFlash})`}else if(canvas.style.filter)canvas.style.filter=''}

/* ======================= rounds, regions, lab ======================= */
function collapse(k){closed.add(k);pendingClose=-1;sfx('boom');shake=Math.max(shake,.6);
 chunks[k].forEach((c,i)=>{const d=i*60+rnd()*200;setTimeout(()=>{let v=0;const f=()=>{v+=.04;c.position.y-=v;c.rotation.x+=.01;c.rotation.z+=.008;if(c.position.y>-60)requestAnimationFrame(f);else c.visible=false};f()},d)});
 OBST.forEach(o=>{if(o.reg===k){let v=0;const f=()=>{v+=.04;o.mesh.position.y-=v;if(o.mesh.position.y>-60)requestAnimationFrame(f);else o.mesh.visible=false};setTimeout(f,rnd()*800)}});
 for(let i=COINS.length-1;i>=0;i--)if(regionOf(COINS[i].x,COINS[i].z)===k)removeCoin(i);for(let i=CORES.length-1;i>=0;i--)if(regionOf(CORES[i].x,CORES[i].z)===k){scene.remove(CORES[i].g);CORES.splice(i,1)}

function endRound(){state='end';BUL.splice(0).forEach(b=>scene.remove(b.m));const R=ranked(),keep=ROUNDS[round].keep;R.forEach((p,i)=>{p.rank=i+1;if(i>=keep)p.out=true});
 const meOut=me.out,won=round===3&&!meOut;banner(meOut?'KNOCKED OUT!':won?'🏆 CHAMPION!':'YOU MADE IT!',meOut?'':`Round ${round+1} survived`);sfx(meOut?'bad':'good');
 setTimeout(()=>{banner('','');showResults(R,keep,meOut,won)},1800)}
function showResults(R,keep,meOut,won){$('#hud').hidden=true;const el=$('#res');el.hidden=false;
 el.innerHTML=`<div class="panel"><h2>${won?'🏆 You are the ROLL BOTS CHAMPION!':meOut?`Knocked out in round ${round+1}`:`Round ${round+1} results`}</h2>
  <table class="res">${R.map((p,i)=>`<tr class="${p.me?'you':''}${i>=keep?' out':''}"><td>${i+1}</td><td>${esc(p.name)}</td><td>🪙 ${p.coins}</td><td>${i>=keep?'❌ out':'✅ safe'}</td></tr>`).join('')}</table>

const LABUP=[{k:'dmg',n:'Overclocked Barrel',em:'🔥',d:'+25% damage',f:()=>lab.dmg*=1.25},{k:'hp',n:'Titan Plating',em:'🛡️',d:'+30 max health',f:()=>lab.hp+=30},{k:'spd',n:'Turbo Wheels',em:'⚡',d:'+12% speed',f:()=>lab.spd*=1.12},

 {k:'spiky',n:'Spiky Marble',em:'🦔',d:'Your marble hurts anyone you roll into',f:()=>lab.spiky=true,once:true},{k:'vault',n:'Coin Vault',em:'🏦',d:'Lose only a quarter of your coins when knocked out',f:()=>lab.vault=true,once:true}];

  <div class="grid">${pool.map((u,i)=>`<div class="card${tried.has(i)?' dead':''}" data-i="${i}"><div class="em">${u.em}</div><b>${u.n}</b><small>${u.d}</small>${tried.has(i)?`<small style="color:${u.ok?'#3EE68A':'#FF8A8A'}">${u.ok?'✅ Installed':'💥 Fried'}</small>`:''}</div>`).join('')}</div>
  <div class="statbar"><span>Installed: <b>${wins}/2</b></span><span>Tries left: <b>${tries}</b></span>${lab.got.length?`<span>Your bot has: ${lab.got.map(k=>LABUP.find(u=>u.k===k).em).join(' ')}</span>`:''}</div>
  <div class="center"><button class="btn" id="labGo">Next round ▶</button></div></div>`;
  el.querySelectorAll('.card').forEach(c=>c.onclick=async()=>{const i=+c.dataset.i;if(tried.has(i)||tries<=0||wins>=2)return;tried.add(i);tries--;const u=pool[i];
   const ok=await ask(makeQ(),`🔧 INSTALL: ${u.n.toUpperCase()}`,'Solve the lock to install it.');if(ok){u.ok=true;u.f();lab.got.push(u.k);wins++}draw()});
  $('#labGo').onclick=()=>{el.hidden=true;nextRound()}};draw()}
function nextRound(){round++;const open=[0,1,2,3].filter(k=>!closed.has(k));

  <div class="statbar" style="font-size:18px"><span>🪙 Coins grabbed: <b>${me.total}</b></span><span>💥 Knockouts: <b>${me.kills}</b></span></div>

 $('#upg').onclick=async()=>{if(S.gears<cost||lv>=10)return;el.hidden=true;const ok=await ask(makeQ('hard'),"🔧 ENGINEER'S CHECK",`Get it right to upgrade your ${W.n}.`);if(ok){S.gears-=cost;S.wl[S.sel]=lv+1;sfx('power')}else S.lockUntil=Date.now()+60000;save();title()}}
const upCost=l=>40+l*35;
