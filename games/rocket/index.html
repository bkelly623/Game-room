function tch(tx,ty){if(tx<0||tx>=L.W)return'#';if(ty<0)return SOLID.has(L.g[0][tx])?L.g[0][tx]:'.';if(ty>=H)return'.';return L.g[ty][tx]}

function moveX(e,dx){if(!dx)return false;e.x+=dx;const t=Math.floor((e.y-e.h+1)/16),b=Math.floor((e.y-.5)/16);
  if(dx>0){const tx=Math.floor((e.x+e.hw)/16);for(let ty=t;ty<=b;ty++)if(solid(tx,ty)){e.x=tx*16-e.hw-.01;return true}}
  else{const tx=Math.floor((e.x-e.hw)/16);for(let ty=t;ty<=b;ty++)if(solid(tx,ty)){e.x=(tx+1)*16+e.hw+.01;return true}}return false}
function moveY(e,dy){e.y+=dy;const l=Math.floor((e.x-e.hw+.5)/16),r=Math.floor((e.x+e.hw-.5)/16);
  if(dy>0){const ty=Math.floor(e.y/16);for(let tx=l;tx<=r;tx++)if(solid(tx,ty)){e.y=ty*16;return 'down'}}
  else if(dy<0){const ty=Math.floor((e.y-e.h)/16);let hit=null,best=99;for(let tx=l;tx<=r;tx++)if(solid(tx,ty)){const dd=Math.abs(tx*16+8-e.x);if(dd<best){best=dd;hit=tx}}if(hit!==null){e.y=(ty+1)*16+e.h;return{tx:hit,ty}}}return null}

  $('#rX').onclick=backOrMap;$('#cpy').onclick=e=>{const ta=$('#logTxt');try{navigator.clipboard.writeText(ta.value).then(()=>e.target.textContent='Copied',()=>ta.select())}catch(_){ta.select()}};
  const rb=$('#redo');rb.onclick=()=>{if(!rb.dataset.sure){rb.dataset.sure=1;rb.textContent='Tap again to redo';return}D.placed=false;D.placement=null;D.m=SK.map(()=>0);surveyStart();startLevel(-1)}}
$('#mapBtn').onclick=()=>{audioInit();if(mode!=='title')openMap()};$('#shopBtn').onclick=()=>{audioInit();if(mode!=='title')openShop()};$('#repBtn').onclick=()=>openReport();$('#titleRep').onclick=openReport;
$('#sndBtn').onclick=()=>{D.sound=!D.sound;audioInit();applyVol();$('#sndWave').style.display=D.sound?'':'none';save()};

/* ===================== input ===================== */
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowdown:'down',s:'down'};
addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();audioInit();
  if(KM[k])K[KM[k]]=true;if(k==='x'||k==='f'||k==='j'||k==='shift')K.fire=true;if((k===' '||k==='arrowup'||k==='w'||k==='z'||k==='k')&&!e.repeat){K.jump=true;if(mode==='play')jumpPress()}
  if(k==='escape'&&mode==='menu'&&L)closeCard()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])K[KM[k]]=false;if(k==='x'||k==='f'||k==='j'||k==='shift')K.fire=false;if(k===' '||k==='arrowup'||k==='w'||k==='z'||k==='k')K.jump=false});
addEventListener('blur',()=>Object.keys(K).forEach(k=>K[k]=false));
const dirs=$('#dirs');const dp=new Map();
function dirsUpd(){let l=false,r=false;for(const [,x] of dp){const b=dirs.getBoundingClientRect();if(x<b.left+b.width/2)l=true;else r=true}K.left=l;K.right=r;$('#bL').classList.toggle('down',l);$('#bR').classList.toggle('down',r)}
dirs.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();try{dirs.setPointerCapture(e.pointerId)}catch(_){}dp.set(e.pointerId,e.clientX);dirsUpd()});
dirs.addEventListener('pointermove',e=>{if(dp.has(e.pointerId)){dp.set(e.pointerId,e.clientX);dirsUpd()}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dirs.addEventListener(t,e=>{dp.delete(e.pointerId);dirsUpd()}));
const bJ=$('#bJ'),bD=$('#bD'),bF=$('#bF');
bF.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();bF.classList.add('down');K.fire=true});['pointerup','pointercancel','pointerleave'].forEach(t=>bF.addEventListener(t,()=>{bF.classList.remove('down');K.fire=false}));
bJ.addEventListener('pointerdown',e=>{e.preventDefault();bJ.classList.add('down');K.jump=true;if(mode==='play')jumpPress()});['pointerup','pointercancel','pointerleave'].forEach(t=>bJ.addEventListener(t,()=>{bJ.classList.remove('down');K.jump=false}));
bD.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();bD.classList.add('down');K.down=true});['pointerup','pointercancel','pointerleave'].forEach(t=>bD.addEventListener(t,()=>{bD.classList.remove('down');K.down=false}));

/* ===================== online save ===================== */
const cloud={ref:null,ok:false,busy:false,dirty:false,t:null};
function summary(){const f=focusS(),st=D.stats;return{placed:!!D.placed,placement:D.placement||null,workingOn:D.placed?SK[f].n:null,gradeOfSkill:D.placed?SK[f].g:null,strongSkills:D.m.filter(m=>m>=MASTER).length,
  problems:st.q,correct:st.correct,accuracy:st.q?Math.round(st.correct/st.q*100):0,skills:SK.map((x,i)=>({skill:x.n,grade:x.g,mastery:Math.round(D.m[i]*100),right:D.c[i],tried:D.n[i]})),
  missed:Object.entries(D.missed).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([w,n])=>w+' x'+n),days:Object.entries(st.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,60).map(([d,v])=>({date:d,problems:v.q,correct:v.c,minutes:Math.round(v.sec/60)})),
  levelsCleared:Object.keys(D.cleared).length,beans:D.beans}}
function cloudSchedule(){if(!cloud.ok)return;cloud.dirty=true;if(!cloud.t)cloud.t=setTimeout(cloudFlush,4000)}
async function cloudFlush(){cloud.t=null;if(!cloud.ok||!cloud.dirty)return;if(cloud.busy){cloud.t=setTimeout(cloudFlush,2000);return}cloud.busy=true;cloud.dirty=false;
  try{await cloud.ref.set({name:D.name||'',updatedAt:new Date().toISOString(),summary:summary(),save:JSON.stringify(D)})}
  catch(e){const c=e&&e.code;if(['invalid_argument','revoked','not_granted','capability_disabled','quota_exceeded'].includes(c))cloud.ok=false;else cloud.dirty=true}
  cloud.busy=false;if(cloud.ok&&cloud.dirty)cloudSchedule()}
async function cloudInit(){try{if(!window.claude||!window.claude.use)return;const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
  cloud.ref=db.doc('players/'+id);const snap=await cloud.ref.get();if(snap.exists){const r=snap.data();if(r&&typeof r.save==='string'){try{const rs=JSON.parse(r.save);if((rs.savedAt||0)>(D.savedAt||0)&&mode==='title'){D=Object.assign(fresh(),rs);try{localStorage.setItem(KEY,r.save)}catch(e){}applyLoaded()}}catch(e){}}}
  cloud.ok=true;if(D.started)cloudSchedule()}catch(e){cloud.ok=false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cloud.ok&&cloud.dirty){clearTimeout(cloud.t);cloudFlush()}if(AC){if(document.hidden)AC.suspend();else AC.resume()}});

/* ===================== loop ===================== */
const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;document.body.classList.toggle('touch',touch);
function layout(){const app=$('#app');const W=app.clientWidth,Hh=app.clientHeight;const land=touch&&W>Hh*1.3;document.body.classList.toggle('land',land);
  let aw=W,ah=Hh-50-124;if(touch&&!land)ah-=170;if(!touch)ah-=30;if(land)aw-=2*170;let w=Math.floor(Math.max(240,Math.min(aw,ah*VW/VH)));const st=$('#stage');st.style.width=w+'px';st.style.height=Math.floor(w*VH/VW)+'px';$('#qbar').style.width=w+'px';
  document.documentElement.style.setProperty('--fs',clamp(w/28,16,22)+'px')}
addEventListener('resize',layout);
let last=performance.now(),activeT=0;['pointerdown','keydown'].forEach(t=>addEventListener(t,()=>activeT=60,true));
function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;now+=dt;
  try{if(L&&(mode==='play'||mode==='flag'||mode==='pipe'||mode==='bonk')){
      if(mode==='play'){updPlayer(dt);updGates(dt)}
      if(mode==='pipe'&&pipeAnim){pipeAnim.t+=dt;P.x+=(pipeAnim.p.tx*16+16-P.x)*Math.min(1,dt*12);if(pipeAnim.t>.65)pipeResolve()}
      if(mode==='bonk'){respawnT-=dt;if(respawnT<=0)respawn()}
      updEnts(dt);updItems(dt);updBoss(dt);updFlag(dt);
      const tx=clamp(P.x-VW*.4,0,L.W*16-VW);cam.x+=(tx-cam.x)*Math.min(1,dt*8)}
    else if(L&&mode==='menu'){}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}if(p.g)p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.puff){p.vx*=.94;p.vy*=.94}}
    if(shake>0)shake=Math.max(0,shake-dt*14);if(flash>0)flash=Math.max(0,flash-dt*1.5);
    if(qbarT>0){qbarT-=dt;if(qbarT<=0)qIdle()}if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').hidden=true}
    if(activeT>0&&!document.hidden&&mode!=='title'){activeT-=dt;dayStat().sec+=dt}
    render();musicTick()}catch(e){console.error(e)}requestAnimationFrame(frame)}
buildCommon();THEMES.forEach((_,i)=>buildTheme(i));buildSprites();load();
function applyLoaded(){$('#nameIn').value=D.name||'';$('#contBtn').hidden=!D.started;
  /* returning players: Continue is the big button and picks up on the level they were on; New game needs two taps */
  if(D.started&&D.placed){$('#contBtn').className='btn';$('#contBtn').textContent='▶ Continue · '+levelName(D.maxIdx||0);$('#goBtn').className='btn ghost';$('#goBtn').textContent='New game';$('#contBtn').parentNode.insertBefore($('#contBtn'),$('#goBtn'))}$('#sndWave').style.display=D.sound?'':'none';hud()}
applyLoaded();cloudInit();
L=genLevel(0);cam.x=0;
function begin(isNew){audioInit();if(isNew){const nm=$('#nameIn').value.trim().slice(0,12);if(D.started){const keepKeys=['placed','m','n','c','counter','review','missed','recent','stats','placement','survey','sound'];const keep={};keepKeys.forEach(k=>keep[k]=D[k]);D=fresh();keepKeys.forEach(k=>{if(keep[k]!==undefined)D[k]=keep[k]})}D.name=nm||'Hero';D.started=true;save()}
  $('#titleOv').hidden=true;mode='menu';hud();
  if(!D.placed){const intro=[{who:'COACH GERALD',pf:'coach',html:`Coo! You must be ${esc(D.name||'Hero')}. I'm Coach Gerald. I'm a pigeon. I have a whistle. That's all you need to know.`},
     {who:'COACH GERALD',pf:'coach',html:'Baron Von Broccoli stole every bean in the kingdom and replaced them with <b>BROCCOLI</b>. Your Rocket Pants run on beans. This is a disaster.'},
     {who:'COACH GERALD',pf:'coach',html:'He built <b>Broccoli Walls</b> everywhere. To smash one, jump up into the <b>Answer Block</b> with the right answer.'},
     {who:'COACH GERALD',pf:'coach',html:'First, <b>Training Day</b>. I\'ll throw math at you to see how strong your brain muscles are. Some of it will be WAY too hard. That\'s on purpose! Do your best and keep running.'},
     {who:'COACH GERALD',pf:'coach',html:'Pro tip: press jump again in the air for a <b>Toot Boost</b>. Yes. It\'s exactly what it sounds like.'}];
    if(D.survey)startTraining();else dialog(intro,startTraining)}
  else if(!isNew&&D.maxIdx!=null){startLevel(D.maxIdx||0)}else openMap()}
let newArm=0;$('#goBtn').onclick=()=>{if(D.started&&D.placed&&Date.now()-newArm>3000){newArm=Date.now();$('#goBtn').textContent='Tap again to erase progress';setTimeout(()=>{$('#goBtn').textContent='New game'},3000);return}begin(true)};$('#contBtn').onclick=()=>begin(false);$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')begin(true)});
layout();requestAnimationFrame(frame);
window.__rp={get D(){return D},get L(){return L},get mode(){return mode},P,K,startLevel,startTraining,answerHit,gen,SK,jumpPress,genLevel,get cam(){return cam},placementDone,begin,pipeResolve,get pipeAnim(){return pipeAnim}};
})();
</script>
