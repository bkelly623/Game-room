<script>(()=>{'use strict';

/* parse a sentence with one {slot} — returns tokens, slot index, slot word, trailing punctuation */
function parseSlot(s){const t=toks(s);let idx=-1,word='',suf='',pre='';t.forEach((x,i)=>{const m=x.match(/^(.*)\{([^}]*)\}(.*)$/);if(m){idx=i;pre=m[1];word=m[2];suf=m[3];t[i]=pre+word+suf}});return{t,idx,word,suf,pre}}

/* ---------- grammar skills, easiest first (Fix It! Grammar style: find it, then fix it) ---------- */
const GSK=[
 {id:'capstart',n:`Capital letter to start a sentence`,g:'1'},
 {id:'end',n:`End marks . ? !`,g:'1'},

const SENT=[
 ...[`The goat ate my homework and then asked for more.`,`Granny Pickles can lift a cow with one hand.`,`My sword is shaped like a loaf of bread.`,`A troll moved into the bathtub last week.`,`The mayor wears socks on his ears for good luck.`,`Every chicken in Snortwood knows karate.`,`The baker sneezed flour all over the king.`,`Our cat thinks she is a dragon.`,`This soup tastes like old boots.`,`The wizard lost his beard in the river.`,`A frog stole the mayor's hat.`,`Nobody knows why the well hums at night.`,`My helmet is actually a soup pot.`,`The blacksmith named his hammer Steve.`,`Three goblins are hiding in the pumpkin patch.`,`The dragon brushes his teeth with a tree.`].map(t=>({t,k:'.'})),

const INFER=[[`Tom grabbed his umbrella and his rain boots before he walked out the door.`,`What is the weather probably like?`,`Rainy`,['Sunny and hot','Very windy'],`Umbrellas and rain boots are for rain.`],[`The troll's tummy rumbled loudly. He stared at the pie on the windowsill and licked his lips.`,`How does the troll feel?`,`Hungry`,['Sleepy','Scared'],`A rumbling tummy and licking lips mean he is hungry.`],[`Granny Pickles put on her helmet, grabbed her frying pan, and marched toward the goblin camp.`,`What is Granny about to do?`,`Fight the goblins`,['Cook dinner for the goblins','Take a nap'],`A helmet, a frying pan "weapon," and marching to their camp means a fight!`],[`When the knight saw the tiny mouse, he screamed, jumped onto a chair, and covered his eyes.`,`How does the knight feel about mice?`,`He is scared of them`,['He loves them','He wants to eat them'],`Screaming and jumping on a chair shows fear.`],[`The baker's apron was covered in white powder, and a warm, sweet smell came from the oven.`,`What was the baker doing?`,`Baking`,['Painting','Sleeping'],`Flour on the apron and a sweet smell from the oven mean baking.`],[`Every time the mayor told a joke, the crowd groaned and some people started walking home.`,`What did the crowd think of the jokes?`,`They were not funny`,['They were the best jokes ever','They were too scary'],`Groaning and leaving means they didn't like the jokes.`],[`The dragon looked at the empty cookie jar. Then he looked at the goat. The goat had crumbs all over its beard.`,`Who ate the cookies?`,`The goat`,['The dragon','The mayor'],`The crumbs on the goat's beard are the clue.`],[`Sir Reginald yawned, rubbed his eyes, and put on his pajamas with little swords on them.`,`What will Sir Reginald do next?`,`Go to sleep`,['Go to battle','Eat breakfast'],`Yawning, rubbing eyes, and pajamas mean bedtime.`],[`The ground was covered in white, the pond was frozen solid, and the snowman was wearing the mayor's hat.`,`What season is it?`,`Winter`,['Summer','Spring'],`Snow and a frozen pond mean winter.`],[`{N} ran into the house, slammed the door, and locked it. Outside, a huge angry goose honked and flapped its wings.`,`Why did {N} lock the door?`,`To get away from the goose`,['Because it was cold','To go to bed'],`The angry goose outside is why.`],[`The wizard's potion turned bright green, started to bubble, and then went BOOM. Now the wizard has no eyebrows.`,`What happened to the wizard's eyebrows?`,`The explosion burned them off`,['He shaved them','The goat ate them'],`The BOOM happened right before his eyebrows were gone.`],[`Lady Cluckington sat on her nest for weeks. One morning she heard a tiny crack, crack, crack under her.`,`What is happening?`,`Her eggs are hatching`,['Her nest is breaking','It is starting to rain'],`Sitting on a nest for weeks, then cracking sounds, means eggs hatching.`],[`The goblin smiled and said, "I would never steal your gold." His pockets were stuffed full and jingling.`,`Is the goblin telling the truth?`,`No, his pockets are full of gold`,['Yes, he is very honest','Yes, he has no pockets'],`Jingling, stuffed pockets give him away.`],[`The little troll held the trophy high over his head and grinned from ear to ear.`,`How does the little troll feel?`,`Proud and happy`,['Sad and lonely','Bored'],`Holding up a trophy and grinning shows pride.`],[`The castle cook dropped the soup, burned the cake, and the dog ate the turkey. The king sighed and ordered pizza.`,`Why did the king order pizza?`,`All the food was ruined`,['He hates soup','It was his birthday'],`Every dish went wrong, so there was nothing to eat.`],[`Every flower in the garden was drooping and brown, and the dirt was dry and cracked.`,`What does the garden need most?`,`Water`,['More sunshine','A tiny hat'],`Dry, cracked dirt and droopy flowers mean no water.`],[`The hero's sword was bent, his shield was dented, and his armor had teeth marks in it.`,`What happened to the hero?`,`He was in a big battle`, const MAIN=[[`Gibberlings are small purple creatures made of scrambled words. They float around in the forest. They like to steal letters from signs. When a hero casts word magic, they pop like bubbles.`,`What Gibberlings are and what they do`,['How to make purple paint','A trip to the beach']],[`Trolls take their bridges very seriously. They sweep them every morning. They paint them on weekends. Some trolls even sing lullabies to their bridges at night.`,`Trolls care a lot about their bridges`,['Trolls are good singers','How to paint a house']],[`Chickens in Snortwood are not ordinary chickens. They wear tiny helmets. They march in lines. Once, they even chased away a whole goblin army.`,`Snortwood chickens are unusually brave and tough`,['What chickens like to eat','How to build a tiny helmet']],[`To make Granny's famous pickle pie, first you need forty pickles. Next, you mash them with a boot. Then you bake it for six days. Finally, you hide it from the goat.`,`How to make pickle pie`,['Why goats like pie','Where Granny buys boots']],[`Dragons sleep most of the day. They sleep on piles of gold, which are lumpy but shiny. A sleeping dragon snores so loud it can knock birds out of the sky.`,`How dragons sleep`,['How birds fly','Where to buy gold']],[`The Snortwood Fair happens every summer. There is a pie-eating contest, a goat race, and a parade of dancing trolls. Everyone in the village comes.`,`What happens at the Snortwood Fair`,['How goats race','Why trolls dance']],[`Lord Gibberish was once a librarian. He loved words so much that he wanted to keep all of them for himself. He stole the Big Book of Words and hid in a cave. Now all the signs in Snortwood are scrambled.`,`How Lord Gibberish caused the word trouble`,['What librarians do all day','How caves are made']],[`Knights need a lot of gear. A knight needs a sword to fight, a shield to block, and armor to stay safe. Some knights also bring a snack in case the battle runs long.`,`The gear a knight needs`,['How to eat a snack','A famous battle']],[`Wizards practice magic every single day. They read thick old books. They stir bubbling potions. Sometimes they turn their own cats into teapots by mistake.`,`What wizards do to practice magic`,['How to take care of a cat','How teapots are made']],[`Rain is important for Snortwood. It helps the pumpkins grow. It fills the well with water. It even washes the goblin mud off the statue.`,`Why rain matters to Snortwood`,['How pumpkins taste','The history of the statue']],[`Mumbleton has trained heroes for a hundred years. He teaches sword fighting in the morning. He teaches word magic in the afternoon. At night, he naps in a hammock made of old capes.`,`Mumbleton's job training heroes`,['How hammocks are made','The best kind of sword']],[`Goblins are terrible at hiding. They giggle when you get close. Their big ears stick out from behind trees. And they always leave a trail of cookie crumbs.`,`Goblins are bad at hiding`,['Goblins love cookies','How tall trees grow']]];
function makeR(s){
 if(s===0)return genDetail();if(s===1)return genSeq();
 if(s===2){const [p,w,a,d]=pick(VOCAB);return{subj:'read',s,title:`Word clue: "${w}"`,passage:p,q:`In the story, what does "${w}" mean?`,ans:a,opts:shuffle([a,...d]),why:`The clues around "${w}" tell you it means "${a}".`,text:p,hl:w}}
 if(s===3){const [p,q,a,d,why]=pick(INFER);return{subj:'read',s,title:`Read between the lines`,passage:fixN(p),q:fixN(q),ans:a,opts:shuffle([a,...d]),why,text:p}}
 const [p,a,d]=pick(MAIN);return{subj:'read',s,title:`What's the big idea?`,passage:p,q:`What is this mostly about?`,ans:a,opts:shuffle([a,...d]),why:`Every sentence tells you something about this: ${low1(a)}.`,text:p}}

function nextQ(subj,opt={}){const E=ENG[subj].E(),L=ENG[subj].len();if(E.survey){const q=ENG[subj].make(E.survey.fi);q.survey=true;return q}

function askGram(q,o={}){return new Promise(res=>{window.__q=q;let first=true,stage=1,wrongTaps=0;const md=o.mode;
 const title=md==='trial'?`Hero Trial: Word Magic`:md==='sign'?`Fix the scrambled sign!`:`✨ Word Magic: ${tierName()}`;
 const draw=()=>{const toksH=q.tokens.map((t,i)=>tokHTML(i===q.bad&&stage===3?q.fix:t,i,stage>=2&&i===q.bad?(stage===3?'fixed':'sel'):'')).join(' ');
  showCard(`<div class="chead"><div><h2>${title}</h2><div class="sub">${q.review?'🔁 A tricky one from before':md==='trial'?'Find it, then fix it!':`Fix the broken sentence to ${md==='sign'?'fix the sign':'cast your spell'}`}</div></div></div>
   <div class="step">${stage===1?`<b>1.</b> Tap the mistake.`:stage===2?`<b>2.</b> Pick the right fix.`:first?`✅ Perfect!`:`✅ Fixed!`}</div>
   <div class="sent" id="sent">${toksH}</div><div id="tip" class="tip">${stage===1&&(GTIP[GSK[q.s].id]&&(wrongTaps>0||q.s===10))?GTIP[GSK[q.s].id]:''}</div>
   <div id="opts" class="opts">${stage===2?q.opts.map(o2=>`<button class="btn opt" data-o="${esc(o2)}">${esc(o2)}</button>`).join(''):''}</div>
   <div id="fb" class="fb">${stage===3?esc(q.why):''}</div>${stage===3?`<div class="center"><button class="btn big" id="goB">${md==='trial'?'Next ➜':md==='sign'?'Done':'Cast it! ✨'}</button></div>`:''}`);
  $('#card').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{if(stage!==1)return;const i=+b.dataset.i;sfx('tap');if(i===q.bad){stage=2;draw()}else{first=false;wrongTaps++;b.classList.add('nope');$('#tip').textContent=wrongTaps>=2?`Look at the glowing word.`:`That word is fine. Look again!`+(GTIP[GSK[q.s].id]?' '+GTIP[GSK[q.s].id]:'');sfx('bad');if(wrongTaps>=2)$('#sent').querySelector(`[data-i="${q.bad}"]`).classList.add('hint')}});
  $('#card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.dataset.o===q.fix){stage=3;sfx('good');draw()}else{first=false;b.disabled=true;b.classList.add('no');sfx('bad');$('#fb').textContent=`Not that one. Try another!`}});
  const g=$('#goB');if(g)g.onclick=()=>{closeCard();res(first)}};draw()})}
function passageHTML(q){return`<div class="note">${q.title?`<div class="ntitle">${esc(q.title)}</div>`:''}${esc(q.passage).split('\n').map(l=>l?`<p>${q.hl?l.replace(new RegExp('\\b('+q.hl+')\\b','i'),'<mark>$1</mark>'):l}</p>`:'').join('')}</div>`}
function askRead(q,o={}){return new Promise(res=>{window.__q=q;let first=true,done=false;const md=o.mode;
 showCard(`<div class="chead"><div><h2>${md==='trial'?'Hero Trial: Reading':md==='lore'?'🪨 Riddle Stone':'📖 Story Scroll'}</h2><div class="sub">${q.review?'🔁 A tricky one from before':'Read carefully, then answer.'}</div></div></div>${passageHTML(q)}<div class="qq">${esc(q.q)}</div><div class="opts col">${q.opts.map(o2=>`<button class="btn opt" data-o="${esc(o2)}">${esc(o2)}</button>`).join('')}</div><div id="fb" class="fb"></div><div class="center" id="goW"></div>`);
 $('#card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;if(b.dataset.o===q.ans){done=true;b.classList.add('yes');sfx('good');$('#fb').textContent=(first?'✅ Correct! ':'✅ Got it! ')+q.why;$('#goW').innerHTML=`<button class="btn big" id="goB">${md==='trial'?'Next ➜':'Continue'}</button>`;$('#goB').onclick=()=>{closeCard();res(first)};$('#goB').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else{first=false;b.disabled=true;b.classList.add('no');sfx('bad');$('#fb').textContent=`Not quite. Look back at the story for a clue!`}})})}
function showNote(q,hint){return new Promise(res=>{showCard(head('📜 '+(q.title||'A note'),`Read carefully. Then go search!`)+passageHTML(Object.assign({},q,{title:''}))+`<div class="qq">${esc(q.q)}</div><div class="sub center">Three spots around town are marked with a floating <b>?</b> — ${q.lm.opts.map(k=>LMS[k]).join(', ')}. Only one is right!</div>${hint?`<div class="fb">Hint: ${esc(q.why)}</div>`:''}<div class="center"><button class="btn big" id="goB">Got it!</button></div>`);
 const f=()=>{closeCard();res()};$('#goB').onclick=f;$('#cX').onclick=f})}
function showGateQ(g){return new Promise(res=>{const q=g.q;showCard(head('🔮 Riddle Stone','Read it, then walk through the arch with the right answer!')+passageHTML(q)+`<div class="qq">${esc(q.q)}</div><div class="sub center">The answers are written on the three arches: ${g.opts.map((o,k)=>`<b>${['Left','Middle','Right'][k]}:</b> ${esc(o)}${g.marks[k]==='x'?' ❌':''}`).join(' · ')}</div><div class="center"><button class="btn big" id="goB">Let's go!</button></div>`);const f=()=>{closeCard();res()};$('#goB').onclick=f;$('#cX').onclick=f})}
async function tapTracker(){if(busy())return;sfx('tap');if(D.job&&!D.job.found){await showNote(D.job.q,D.job.misses>=2);return}const g=GATES.find(g=>g.q&&!D.gates[g.id]&&(g.zone==='dungeon')===(D.pos.zone==='dungeon'));if(g){await showGateQ(g);return}const t=target();toast(t.t)}

/* ===================== combat + magic ===================== */
const PROJ=[];
function nearestEnemy(range){let b=null,bd=range;ENEMIES.forEach(e=>{if(e.dying)return;const d=Math.hypot(e.x-hero.x,e.z-hero.z);if(d<bd){bd=d;b=e}});return b}
function swing(){if(busy()||hero.dead||hero.atk>0)return;audioInit();hero.atk=.38;hero.hitDone=false;sfx('swing');const e=nearestEnemy(3.4);if(e)hero.ry=Math.atan2(e.x-hero.x,e.z-hero.z);else if(boss&&Math.hypot(boss.x-hero.x,boss.z-hero.z)<5)hero.ry=Math.atan2(boss.x-hero.x,boss.z-hero.z)}
function swingHit(){const fx=Math.sin(hero.ry),fz=Math.cos(hero.ry),inArc=(x,z,rng)=>{const dx=x-hero.x,dz=z-hero.z,d=Math.hypot(dx,dz);return d<rng&&(d<.8||(dx*fx+dz*fz)/d>.25)};let any=false;
 ENEMIES.forEach(e=>{if(!e.dying&&inArc(e.x,e.z,2.3+e.r)){damageEnemy(e,heroDmg(),'sword');any=true}});
 if(boss&&!boss.dead&&inArc(boss.x,boss.z,boss.vul>0?3.6:3.2)){bossSwordHit();any=true}
 DUMMIES.forEach(d=>{if(!d.dead&&inArc(d.x,d.z,2.2)){any=true;d.wob=1;sfx('hit');burst(d.x,1.8,d.z,0xE8C88A,8,.15);if(D.story===1){d.dead=true;setTimeout(()=>{d.g.visible=false},250);D.flags.dum=(D.flags.dum||0)+1;floatText(d.x,2.6,d.z,'WHACK!','#FFE070');if(D.flags.dum>=3){D.story=2;save();setTimeout(()=>say('Guildmaster Mumbleton',`Marvelous whacking! Those dummies never stood a chance. Come talk to me for your Hero Trial!`,{pitch:.7}),600)}updateHUD()}}});
 CHICKS.forEach(c=>{if(c.y===0&&inArc(c.x,c.z,1.8)){kickChicken(c);any=true}});if(any)shake=Math.max(shake,.12)}
async function castSpell(){if(busy()||hero.dead)return;audioInit();if(D.story<3){toast(`You haven't learned Word Magic yet. Finish Mumbleton's Hero Trial!`);return}
 const q=nextQ('gram');const ok=await askGram(q,{mode:'spell'});grade(q,ok);
 if(ok){addXP(2);let tgt=nearestEnemy(18),tx,ty=1.2,tz;if(boss&&!boss.dead&&Math.hypot(boss.x-hero.x,boss.z-hero.z)<22&&(!tgt||boss.shield>0)){tx=boss.x;ty=boss.y;tz=boss.z;tgt='boss'}else if(tgt){tx=tgt.x;tz=tgt.z;hero.ry=Math.atan2(tx-hero.x,tz-hero.z)}else{tx=hero.x+Math.sin(hero.ry)*10;tz=hero.z+Math.cos(hero.ry)*10}
  await shootFireball(tx,ty,tz,spellTier(),tgt)}else{sfx('fizzle');burst(hero.x,1.8,hero.z,0x9A9A9A,10,.2,2);floatText(hero.x,2.6,hero.z,'fizzle...','#BBBBBB')}}
const TIERCOL=[0,0xFF7A1A,0x5AC8FF,0x7AE05A,0xB36BFF];
function shootFireball(tx,ty,tz,tier,tgt){return new Promise(res=>{sfx('cast');const g=grp(hero.x,1.5,hero.z);const c=TIERCOL[tier]||0xFF7A1A;sph(.35+tier*.06,M(c,{basic:1}),0,0,0,g,8,6);sph(.55+tier*.08,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.35}),0,0,0,g,8,6);
 PROJ.push({g,tx,ty,tz,tier,tgt,res,spd:22,c})})}
function updProj(dt){for(let i=PROJ.length-1;i>=0;i--){const p=PROJ[i];if(p.tgt&&p.tgt!=='boss'&&!p.tgt.dying){p.tx=p.tgt.x;p.tz=p.tgt.z}if(p.tgt==='boss'&&boss){p.tx=boss.x;p.ty=boss.y;p.tz=boss.z}
  const v=new THREE.Vector3(p.tx-p.g.position.x,p.ty-p.g.position.y,p.tz-p.g.position.z),d=v.length();if(d<.6||d>60){explode(p);scene.remove(p.g);PROJ.splice(i,1);p.res();continue}v.multiplyScalar(Math.min(d,p.spd*dt)/d);p.g.position.add(v);p.g.rotation.y+=dt*9;if(rnd()<.6)burst(p.g.position.x,p.g.position.y,p.g.position.z,p.c,1,.15,1)}}
function explode(p){const x=p.g.position.x,y=p.g.position.y,z=p.g.position.z;sfx('boom');shake=Math.max(shake,.22);burst(x,y,z,p.c,22,.3,8);burst(x,y,z,0xFFFFFF,8,.2,5);const dmg=4+p.tier*2;
 ENEMIES.forEach(e=>{if(!e.dying&&Math.hypot(e.x-x,e.z-z)<3.2)damageEnemy(e,dmg,'spell')});if(p.tgt==='boss'&&boss){if(boss.vul>0){boss.hp-=3;floatText(boss.x,boss.y+2,boss.z,'3','#fff');if(boss.hp<=0)bossSwordHit()}else bossSpellHit()}}
function onEnemyDown(e){if(D.story===5&&e.sp.tag==='camp'){const left=SPAWNS.filter(p=>p.tag==='camp'&&!p.used).length;if(left===0)setTimeout(()=>toast(`🪓 All the Grumplings are gone! Talk to Hank.`),500)}}
function usePotion(){if(busy()||hero.dead)return;audioInit();if(D.pot<=0){toast(`No potions! Buy some from Mags at The Soggy Boot.`);return}if(D.hp>=heroMaxHP()){toast(`Your hearts are already full!`);return}D.pot--;D.hp=Math.min(heroMaxHP(),D.hp+6);sfx('heal');burst(hero.x,1.5,hero.z,0xFF5A7A,14,.18,3);updateHUD();save()}

 $('#gold').textContent=`🪙 ${D.gold}`;$('#potN').textContent=D.pot;const a=D.align;$('#alignI').textContent=a>=25?'😇':a<=-25?'😈':'🙂';$('#alignB').style.left=(50+a/2)+'%';
 Object.values(NPCS).forEach(n=>{let m=false;const s=D.story;if(n.id==='mumbleton')m=s===0||s===2||s===8||(s===4&&!D.flags.toldGo);else if(ERR[n.id])m=s===3&&(!D.errands[n.id]&&!(D.job&&!D.job.found)||D.errands[n.id]==='found');else if(n.id==='hank')m=s===5;else if(n.id==='mayor')m=D.flags.purse==='carry';n.mark.visible=m});
 $('#bMagic').classList.toggle('locked',D.story<3);purse.visible=purseM.visible=D.story>=4&&!D.flags.purse}
let trkLast='';function slowTick(){if(SIGNS.some(s=>s.state!==signBroken(s.i)))refreshSigns();LORE.forEach(l=>{const f=D.flags['lore_'+l.id];l.glow.visible=!(f&&Date.now()-f<5*60000)})}
function trackerTick(){const t=target();if(t.t!==trkLast){trkLast=t.t;$('#trkText').textContent=t.t}const ar=$('#trkArrow');if(t.x==null||t.note){ar.style.visibility='hidden';$('#trkDist').textContent=t.note?'📜':'';return}
 const dx=t.x-hero.x,dz=t.z-hero.z,d=Math.hypot(dx,dz);ar.style.visibility=d<3?'hidden':'visible';const fx=-Math.sin(cyaw),fz=-Math.cos(cyaw),rx=Math.cos(cyaw),rz=-Math.sin(cyaw);const ang=Math.atan2(dx*rx+dz*rz,dx*fx+dz*fz);ar.style.transform=`rotate(${ang}rad)`;$('#trkDist').textContent=d<3?'here!':Math.round(d)+'m'}

const keys={};const joy={id:null,ox:0,oy:0,x:0,y:0};const camDrag={id:null,lx:0};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=1;if(mode!=='play')return;if(dlgOpen&&(e.code==='Space'||e.code==='Enter')){$('#dlg').click();e.preventDefault();return}if(busy())return;
 if(e.code==='KeyJ'||e.code==='Space'){swing();e.preventDefault()}else if(e.code==='KeyK'){castSpell()}else if(e.code==='KeyE'||e.code==='Enter'){doAct()}else if(e.code==='KeyQ'){usePotion()}});
addEventListener('keyup',e=>{keys[e.code]=0});
function bindBtn(id,f){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');f()});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('down')))}
function inputInit(){bindBtn('#bSword',swing);bindBtn('#bMagic',castSpell);bindBtn('#bAct',doAct);bindBtn('#bPot',usePotion);$('#tracker').onclick=tapTracker;$('#menuBtn').onclick=()=>{if(!busy())openMenu()};
 const gl=$('#touch');gl.addEventListener('pointerdown',e=>{audioInit();if(busy())return;const w=innerWidth;if(e.clientX<w*.5&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;const j=$('#joy');j.style.left=(e.clientX-60)+'px';j.style.top=(e.clientY-60)+'px';j.classList.add('on')}
  else if(camDrag.id===null){camDrag.id=e.pointerId;camDrag.lx=e.clientX}gl.setPointerCapture(e.pointerId)});
 gl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;$('#joyKnob').style.transform=`translate(${dx}px,${dy}px)`}
  else if(e.pointerId===camDrag.id){cyaw-=(e.clientX-camDrag.lx)*.008;camDrag.lx=e.clientX}});
 const up=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$('#joyKnob').style.transform='';$('#joy').classList.remove('on')}if(e.pointerId===camDrag.id)camDrag.id=null};gl.addEventListener('pointerup',up);gl.addEventListener('pointercancel',up)}

  <h3>Reading log (latest)</h3><table class="tbl">${rl.map(r=>`<tr><td>${r.d}</td><td>${esc(r.t)}</td><td>${esc(RSK[r.s]?RSK[r.s].n:'')}</td></tr>`).join('')||'<tr><td>Nothing yet</td></tr>'}</table>`}

  ${eng.review.length?`<p class="sub">Coming back for review: ${eng.review.length} item${eng.review.length>1?'s':''}.</p>`:''}`}

let lastT=performance.now(),acc=0;const tmpV=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?68:58;cdist=w<h?9.2:8;cam.updateProjectionMatrix()}
