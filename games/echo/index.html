<style>
/* Layout: a miner's console. Mine-shaft canvas (16:10) on top, spelling console with big on-screen keyboard beneath; build mode swaps the console for a block hotbar. Single deep-cave look. */
:root{
  --cave:#14101C; --panel:#221B2E; --panel2:#2F2640; --line:#4A3C5E;
  --ink:#F3ECDF; --ink2:#B8AAC9; --lamp:#FFC94D; --lamp-d:#B5841E;
  --ok:#73D98A; --bad:#F2687B; --gem:#5FE3E8;
  --display:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cave);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.top{display:flex;align-items:center;gap:8px;flex:none}
.brand{font-family:var(--display);font-weight:700;color:var(--lamp);font-size:20px;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--display);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.depth b{color:var(--lamp)} .chip.streak b{color:var(--ok)}
.ibtn{height:34px;min-width:34px;border-radius:10px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0 8px;font-family:var(--display);font-size:14px}
.ibtn svg{width:18px;height:18px}
@media (max-width:440px){.brand{font-size:17px}.chip{font-size:13px;padding:2px 8px}.hide-sm{display:none}}
#stage{position:relative;flex:none;align-self:center;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px var(--line),0 12px 40px rgba(0,0,0,.5);background:#000}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,32px);color:var(--lamp);text-shadow:0 3px 0 #3A2600,0 0 20px rgba(255,201,77,.4);pointer-events:none;animation:bannerIn 2.8s ease both}
#banner small{display:block;font-size:.5em;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 0 #000}
@keyframes bannerIn{0%{opacity:0;transform:scale(.9)}12%,78%{opacity:1;transform:none}100%{opacity:0}}
#bolt{position:absolute;left:8px;right:8px;bottom:8px;margin:0 auto;max-width:560px;background:rgba(14,36,48,.94);border:2px solid var(--gem);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.35;pointer-events:none}
#bolt b{color:var(--gem);font-family:var(--display);margin-right:5px}
/* console */
#console{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.prompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hear{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:9px 14px;background:var(--gem);color:#06303D;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:0 4px 0 #1E8A90}
.hear.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0B0812;border:2px solid var(--line)}
.hear:active{transform:translateY(3px);box-shadow:0 1px 0 #1E8A90}
.hear svg{width:20px;height:20px}
.plabel{color:var(--ink2);font-size:14px;margin-left:auto;text-align:right}
.plabel b{color:var(--ink)}
.clue{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:17px;line-height:1.4}
.answer{min-height:60px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;background:#0D0A14;border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-family:var(--display);font-size:clamp(28px,7vw,38px);letter-spacing:.06em}
.answer .ph{font-family:var(--body);font-size:16px;color:#7D6F92;letter-spacing:0}
.answer .caret{width:3px;height:1em;background:var(--lamp);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.answer.ok{border-color:var(--ok);background:#12301C}
.answer.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fix{background:#2A1620;border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:16px;line-height:1.45}
.fix .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fix .w{font-family:var(--display);font-size:24px;letter-spacing:.06em}
.fix .w i{font-style:normal;color:var(--bad);text-decoration:line-through}
.fix .w u{text-decoration:none;color:var(--lamp);border-bottom:3px solid var(--lamp)}
.fix small{color:var(--ink2)}
.fix .tip{margin-top:4px;color:var(--ink)}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:58px;height:clamp(40px,6.2vh,52px);border-radius:10px;border:2px solid #0B0812;background:var(--panel2);font-family:var(--display);font-size:22px;box-shadow:0 3px 0 #0B0812;touch-action:manipulation;padding:0}
.key:active,.key.down{transform:translateY(2px);box-shadow:0 1px 0 #0B0812;background:var(--line)}
.key.wide{flex:1.6;max-width:96px;font-size:15px}
.key.go{flex:2.2;max-width:150px;background:var(--lamp);color:#3A2600;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--lamp-d)}
/* build */
#buildbar{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hotbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.slot{position:relative;border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2)}
.slot canvas{width:34px;height:34px;image-rendering:pixelated}
.slot b{position:absolute;right:5px;top:3px;font-family:var(--display);font-size:13px;color:var(--ink)}
.slot.sel{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp) inset}
.slot:disabled{opacity:.4}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:700;font-size:18px;border:0;border-radius:12px;padding:11px 18px;background:var(--lamp);color:#3A2600;box-shadow:0 4px 0 var(--lamp-d);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lamp-d)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #0B0812;border:2px solid var(--line)}
.btn.small{font-size:15px;padding:8px 13px}
.btn.on{outline:3px solid var(--lamp)}
.hint{color:var(--ink2);font-size:14px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;background:rgba(10,8,16,.88);backdrop-filter:blur(3px);
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:620px;margin:auto;background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:0 8px 0 #0B0812;padding:20px}
.card h2{font-family:var(--display);margin:0 0 6px;font-size:28px;color:var(--lamp);line-height:1.05;text-wrap:balance}
.card p{line-height:1.5;margin:0 0 12px;color:var(--ink)}
.card .sub{color:var(--ink2)}
.logo{font-family:var(--display);font-weight:700;text-align:center;font-size:clamp(48px,14vw,76px);line-height:.9;color:var(--lamp);text-shadow:0 4px 0 #6B4A0A,0 8px 0 #2A1D05,0 0 30px rgba(255,201,77,.35);margin:4px 0 8px}
.tag{text-align:center;color:var(--ink2);margin-bottom:16px;font-size:17px}
.namebox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.namebox label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.namebox input{font-family:var(--display);font-size:24px;text-align:center;width:min(280px,100%);padding:8px;border-radius:12px;border:3px solid var(--line);background:#0D0A14;color:var(--ink)}
.center{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.boltline{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;background:#10222C;border:2px solid #2A6A78;border-radius:14px;padding:12px;margin-bottom:14px}
.boltline canvas{width:52px;height:52px;image-rendering:pixelated;border-radius:10px;background:#183442}
.boltline p{margin:0}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 14px}
@media (max-width:460px){.res{grid-template-columns:minmax(0,1fr)}}
.res div{background:#1A1424;border:2px solid var(--line);border-radius:12px;padding:10px}
.res b{display:block;font-family:var(--display);font-size:20px;color:var(--lamp)}
.res small{color:var(--ink2)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 10px;border-radius:10px;background:#1A1424;margin-bottom:6px;align-items:center}
.feat b{font-size:15px}
.feat .st{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.st.m{background:var(--ok);color:#0E2A16}.st.w{background:var(--lamp);color:#3A2600}.st.n{background:#3A2F4C;color:var(--ink2)}
.feat .bar{grid-column:1/-1;height:7px;border-radius:99px;background:#0D0A14;overflow:hidden}
.feat .bar i{display:block;height:100%;background:var(--ok)}
.feat small{grid-column:1/-1;color:var(--ink2);font-size:13px}
.stagehead{font-family:var(--display);color:var(--ink2);font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 6px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:#2A1620;border:1px solid var(--bad);border-radius:8px;padding:2px 8px;font-size:15px}
textarea.log{width:100%;min-height:96px;background:#0D0A14;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px;font:14px/1.4 var(--body);resize:vertical;user-select:text;-webkit-user-select:text}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app">
  <div class="top">
    <div class="brand">ECHO MINES</div>
    <span class="chip depth" title="Depth"><b id="depthN">0</b> ft</span>
    <span class="chip streak hide-sm" title="Streak">streak <b id="streakN">0</b></span>
    <button class="ibtn" id="modeBtn" aria-label="Build your base">Base</button>
    <button class="ibtn" id="sndBtn" aria-label="Sound on"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 7h3l5-4v14l-5-4H3z"/><path id="sndWave" d="M14 6.5a5 5 0 0 1 0 7M16.5 4a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
    <button class="ibtn" id="repBtn" aria-label="Grown-ups report">Report</button>

  <div id="stage">

    <div id="banner" hidden></div>

  </div>
  <div id="console">
    <div class="prompt">
      <button class="hear" id="hearW"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 7h3l5-4v14l-5-4H3z"/><path d="M14 6.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Hear word</button>
      <button class="hear alt" id="hearS">Hear sentence</button>

  <div id="buildbar" hidden>

  </div>
</div>

<div class="ov" id="titleOv">
  <div class="card">
    <div class="logo">ECHO<br>MINES</div>
    <div class="tag">Hear the echo. Spell the word. Dig deeper.</div>

    <div class="center"><button class="btn" id="goBtn">Start</button><button class="btn ghost" id="titleRep">Grown-ups</button></div>
  </div>
</div>
<div class="ov" id="msgOv" hidden><div class="card" id="msgCard"></div></div>
<div class="ov" id="repOv" hidden><div class="card" id="repCard"></div></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= spelling content (Words Their Way-style feature sequence) ================= */
const STAGES=['Letter Name','Within Word Pattern','Syllables and Affixes'];
const FEATS=[
 {n:'Short a and i',st:0,tip:'Short a says /a/ like apple. Short i says /i/ like itch.',w:[['cat','The cat napped in a sunny spot.'],['map','We need a map to find the cave.'],['sit','Sit down on the rock.'],['big','That is a big spider.'],['hat','My hat has a lamp on it.'],['pin','Use a pin to hold the paper.'],['bag','Put the gems in your bag.'],['lip','I bit my lip.'],['fan','The fan blew cool air.'],['dig','Let us dig for treasure.'],['rat','A rat ran past the torch.'],['win','We will win the race.']]},
 {n:'Short e, o and u',st:0,tip:'Short e says /e/ like egg, short o says /o/ like octopus, short u says /u/ like up.',w:[['bed','I made my bed.'],['hop','Frogs hop on lily pads.'],['sun','The sun is hot today.'],['net','Catch the bug with a net.'],['fox','A red fox ran into the woods.'],['cup','Fill the cup with water.'],['pen','Write it with a pen.'],['log','Sit on the log.'],['bug','A bug crawled up the wall.'],['red','The lava is bright red.'],['dot','Draw a dot on the map.'],['mud','My boots are full of mud.']]},
 {n:'Digraphs: sh, ch, th, wh, ck',st:0,tip:'Two letters can make one sound. After a short vowel, the /k/ sound at the end is usually ck.',w:[['ship','The ship sailed away.'],['chin','He rubbed his chin.'],['that','Look at that cave.'],['when','When can we go mining?'],['duck','A duck swam in the pond.'],['shop','Let us shop for a new hat.'],['chop','Chop the wood for the fire.'],['with','Come with me.'],['rock','The rock is too heavy.'],['fish','The fish swam fast.'],['much','How much gold did you find?'],['back','Bring the pickaxe back.']]},
 {n:'Blends: st, fr, tr, -nd, -mp',st:0,tip:'In a blend you can hear every letter. Stretch it out slowly: s-t-o-p.',w:[['stop','Stop at the edge of the cliff.'],['frog','The frog jumped into the water.'],['trip','We took a trip to the mountains.'],['hand','Hold my hand on the bridge.'],['jump','Jump over the gap.'],['black','The coal is black.'],['plant','Plant the seed in the dirt.'],['swim','Can you swim across the lake?'],['crab','A crab pinched my toe.'],['glad','I am glad you came.'],['best','That was the best day ever.'],['drum','Bang the drum loudly.']]},
 {n:'Long a and i with silent e',st:1,tip:'A silent e at the end makes the vowel say its own name: cap becomes cape, kit becomes kite.',w:[['cake','We ate cake at the party.'],['bike','I rode my bike to the park.'],['game','Let us play a game.'],['ride','Can I ride the mine cart?'],['lake','The lake is deep and cold.'],['time','What time is it?'],['gate','Open the gate.'],['kite','The kite flew high.'],['made','I made a tower of blocks.'],['pine','A pine tree stood on the hill.'],['shape','A cube is a shape with six sides.'],['smile','Give me a big smile.']]},
 {n:'Long o and u with silent e',st:1,tip:'The silent e trick works for o and u too: hop becomes hope, cub becomes cube.',w:[['home','Let us go home.'],['cute','The puppy is so cute.'],['rope','Climb down the rope.'],['mule','The mule carried the bags.'],['nose','My nose is cold.'],['tube','Squeeze the tube of paint.'],['joke','Tell me a funny joke.'],['huge','A huge cave opened up below us.'],['stone','The wall is made of stone.'],['flute','She played a song on the flute.'],['globe','Spin the globe and pick a country.'],['rule','The first rule of mining is safety.']]},
 {n:'Vowel teams: ai, ay, ee, ea',st:1,tip:'When two vowels go walking, the first one says its name. Long a at the end of a word is usually ay; in the middle it is often ai.',w:[['rain','The rain fell all night.'],['play','Can you play outside?'],['feet','My feet are tired.'],['team','Our team won the game.'],['paint','Paint the wall blue.'],['stay','Stay close to the torch.'],['green','The grass is green.'],['beach','We built a castle at the beach.'],['trail','Follow the trail of gems.'],['gray','The sky turned gray.'],['sleep','Bats sleep upside down.'],['clean','Clean your pickaxe after mining.']]},
 {n:'Vowel teams: oa, ow, igh, y',st:1,tip:'Long i at the end of a short word is often y, like fly. Before a t, long i is often igh, like night.',w:[['boat','We rowed the boat across the river.'],['snow','The snow covered the mountain.'],['night','Owls hunt at night.'],['fly','Bats fly in the dark.'],['coat','Wear a warm coat.'],['grow','Seeds grow into plants.'],['light','Turn on your helmet light.'],['try','Try one more time.'],['road','The road goes to the mine.'],['slow','The turtle is slow.'],['bright','The diamond was bright.'],['sky','Stars filled the sky.']]},
 {n:'R-controlled: ar, or, er, ir, ur',st:1,tip:'The r changes the vowel sound. er, ir and ur all sound the same, so those words have to be remembered.',w:[['car','We drove the car to the store.'],['fork','Eat with a fork.'],['her','I gave her a gem.'],['bird','A bird sang in the tree.'],['turn','Turn left at the tunnel.'],['shark','A shark swam under the boat.'],['storm','The storm shook the windows.'],['girl','The girl found a gold nugget.'],['hurt','Did the fall hurt?'],['start','Start digging here.'],['first','I was the first one down.'],['burn','Lava can burn you.']]},
 {n:'oi, oy, ou, ow, oo, aw',st:1,tip:'oy and ow usually come at the end of a word or syllable. oi and ou usually sit in the middle.',w:[['coin','I found a gold coin.'],['boy','The boy waved hello.'],['cloud','A cloud covered the sun.'],['cow','The cow said moo.'],['moon','The moon is full tonight.'],['book','Read me a book.'],['saw','I saw a bat.'],['point','Point to the exit.'],['toy','That robot is my favorite toy.'],['shout','Do not shout in the cave.'],['crown','The king wore a crown.'],['spoon','Stir it with a spoon.']]},
 {n:'Tricky consonants: tch, dge, kn, wr',st:1,tip:'Right after a short vowel, /ch/ is spelled tch and /j/ is spelled dge. In kn and wr, the first letter is silent.',w:[['catch','Catch the ball.'],['bridge','Cross the bridge slowly.'],['knee','I scraped my knee.'],['write','Write your name here.'],['match','Find the match for this sock.'],['badge','He earned a badge for mining.'],['knot','Tie a knot in the rope.'],['wrap','Wrap the gift.'],['pitch','It was pitch black in the tunnel.'],['judge','The judge picked a winner.'],['knife','Cut the apple with a knife.'],['wrong','That turn was the wrong way.']]},

    <div class="res"><div><small>Starting layer</small><b>${TIERS[t].n}</b></div><div><small>Patterns mastered</small><b>${strong.length} of ${FEATS.length}</b></div><div><small>First target</small><b>${esc(FEATS[f].n)}</b></div></div>
    <p class="sub">The words will stay just hard enough. Get a bunch right and we dig faster. Miss a few and I'll mix in easier ones and bring back the tricky words later.</p>`,
    [['Drop to my layer!',()=>{D.lastTier=t;save();dropTo(TIER_START[t]);banner('Now entering',TIERS[t].n);sfx('tier');nextWord()}]])}
function enterMine(){mode='mine';$('#console').hidden=false;$('#buildbar').hidden=true;$('#modeBtn').textContent='Base';miner.y=D.depth;layout();
  if(D.survey||D.placed){nextWord()}updateTop()}
function enterBuild(){mode='build';baseInit();try{speechSynthesis.cancel()}catch(e){}$('#console').hidden=true;$('#buildbar').hidden=false;$('#modeBtn').textContent='Mine';renderHotbar();layout()}
$('#modeBtn').onclick=()=>{audioInit();if(!D.placed){boltLine('Finish the survey first, then you can build!',2.5);return}if(mode==='mine')enterBuild();else enterMine()};
$('#backBtn').onclick=enterMine;
$('#eraseBtn').onclick=()=>{eraseMode=!eraseMode;$('#eraseBtn').classList.toggle('on',eraseMode);renderHotbar()};
$('#nightBtn').onclick=()=>{night=!night;$('#nightBtn').textContent=night?'Day':'Night'};
$('#sndBtn').onclick=()=>{D.sound=!D.sound;audioInit();if(sfxG)sfxG.gain.value=D.sound?.5:0;$('#sndWave').style.display=D.sound?'':'none';$('#sndBtn').setAttribute('aria-label',D.sound?'Sound on':'Sound off');save()};
$('#goBtn').onclick=startFlow;$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')startFlow()});
$('#repBtn').onclick=openReport;$('#titleRep').onclick=openReport;

function openReport(){const card=$('#repCard');const st=D.stats;const acc=st.words?Math.round(st.correct/st.words*100):0;const f=focusF();
  const days=Object.entries(st.days).sort((a,b)=>b[0].localeCompare(a[0]));const mins=Math.round(days.reduce((a,[,d])=>a+d.sec,0)/60);
  const fRow=(x,i)=>{const m=D.m[i],cls=m>=MASTER?'m':i===f?'w':D.n[i]?'w':'n',lab=m>=MASTER?'Mastered':i===f?'Working on':D.n[i]?'Practicing':'Not yet';
    return`<div class="feat"><b>${esc(x.n)}</b><span class="st ${cls}">${lab}</span><div class="bar"><i style="width:${Math.round(m*100)}%"></i></div><small>${D.c[i]} of ${D.n[i]} right</small></div>`};
  let feats='';STAGES.forEach((sn,si)=>{feats+=`<div class="stagehead">${sn} stage</div>`+FEATS.map((x,i)=>x.st===si?fRow(x,i):'').join('')});
  const missed=Object.entries(D.missed).sort((a,b)=>b[1]-a[1]).slice(0,16).map(([w])=>w);
  const pl=D.placement;const stage=STAGES[FEATS[f].st];
  const log=`Echo Mines spelling log (${D.name||'student'})\n`+days.slice(0,14).map(([d,v])=>`${d}: ${v.w} words, ${v.w?Math.round(v.c/v.w*100):0}% correct, ${Math.round(v.sec/60)} min`).join('\n')+
    `\nCurrent stage: ${stage}. Working on: ${FEATS[f].n}. Patterns mastered: ${D.m.filter(m=>m>=MASTER).length} of ${FEATS.length}.`+(pl?`\nPlacement survey ${pl.date}: ${pl.correct}/${pl.words} correct.`:'');
  card.innerHTML=`<h2>Grown-ups report</h2><p class="sub">${esc(D.name||'Your miner')} · spelling, measured in the game itself.</p>
  <div class="res"><div><small>Spelling stage</small><b>${D.placed?stage:'Survey not done'}</b></div><div><small>Working on</small><b>${D.placed?esc(FEATS[f].n):'—'}</b></div><div><small>Words · accuracy</small><b class="num">${st.words} · ${acc}%</b></div></div>
  ${pl?`<p class="sub">Placement survey on ${pl.date}: ${pl.correct} of ${pl.words} correct. Total time practicing: ${mins} min.</p>`:''}
  ${feats}
  <div class="stagehead">Words to practice</div><div class="words">${missed.length?missed.map(w=>`<span>${esc(w)}</span>`).join(''):'<span style="border-color:var(--line)">None yet</span>'}</div>
  <div class="stagehead">Portfolio log</div><textarea class="log" id="logTxt" readonly>${esc(log)}</textarea>
  <div class="center" style="margin-top:12px"><button class="btn small" id="copyLog">Copy log</button><button class="btn ghost small" id="redo">Redo placement</button><button class="btn ghost small" id="closeRep">Close</button></div>
  <p class="sub" style="margin-top:12px;font-size:14px">How it adapts: a placement survey finds the first spelling pattern he hasn't mastered. After that, about 7 in 10 words come from that pattern, the rest review older patterns or preview the next one. Missed words come back a few words later and must be spelled right twice. If accuracy drops below about 65%, it mixes in easier review until he's back on track.</p>`;
  card.querySelector('#closeRep').onclick=()=>{$('#repOv').hidden=true};
  card.querySelector('#copyLog').onclick=e=>{const ta=card.querySelector('#logTxt');const done=()=>{e.target.textContent='Copied'};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();})}catch(_){ta.focus();ta.select()}};
  const rb=card.querySelector('#redo');rb.onclick=()=>{if(!rb.dataset.sure){rb.dataset.sure=1;rb.textContent='Tap again to redo';return}const keep={name:D.name,inv:D.inv,base:D.base,stats:D.stats,sound:D.sound};D=Object.assign(fresh(),keep);save();$('#repOv').hidden=true;$('#titleOv').hidden=true;
    miner.y=0;camY=-200;updateTop();startFlow()};
  $('#repOv').hidden=false}

/* ================= loop / layout ================= */
function layout(){const app=$('#app');const W=app.clientWidth;const H=app.clientHeight;const consoleH=mode==='mine'?(innerHeight<560?250:Math.min(360,Math.max(300,H*.46))):(innerHeight<560?150:200);
  let w=Math.min(W,(H-consoleH-60)*1.6);w=Math.max(220,Math.floor(w));const st=$('#stage');st.style.width=w+'px';st.style.height=Math.floor(w/1.6)+'px'}
addEventListener('resize',layout);
let last=performance.now(),activeT=0;
['pointerdown','keydown'].forEach(t=>addEventListener(t,()=>activeT=60,true));
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;
  try{if(miner.fallT>0)miner.fallT=Math.max(0,miner.fallT-dt);if(miner.swingT>0)miner.swingT-=dt;if(flashT>0)flashT-=dt;if(shake>0)shake=Math.max(0,shake-dt*12);updParts(dt);
    if(boltT>0){boltT-=dt;if(boltT<=0)$('#bolt').hidden=true}
    if(activeT>0&&!document.hidden&&$('#titleOv').hidden){activeT-=dt;const ds=dayStat();ds.sec+=dt;if((now|0)%10===0&&((now-dt)|0)%10!==0)save()}
    ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;if(mode==='build')drawBase();else drawMine()}catch(e){console.error(e)}
  requestAnimationFrame(frame)}
buildTex();load();buildKB();$('#nameIn').value=D.name||'';$('#goBtn').textContent=D.placed?'Keep digging':D.survey?'Finish the survey':'Start';$('#sndWave').style.display=D.sound?'':'none';
miner.y=D.depth;camY=D.depth*16-VH*.58;updateTop();layout();renderAnswer();requestAnimationFrame(frame);
window.__em={get D(){return D},get Q(){return Q},typeKey,submit,get phase(){return phase},focusF,enterBuild,enterMine,openReport,startFlow};
})();
</script>

</body></html>
