<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Room</title>
<meta name="theme-color" content="#FFF6E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Room">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F2B632'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#FFF6E6;--bg2:#FCEBD0;--card:#FFFFFF;--ink:#2A2140;--ink2:#6C6383;--line:#EADCC2;--accent:#F2B632;--accent-d:#B5841A;--good:#2FA35A;--bad:#D2463C;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);
  background-image:radial-gradient(circle at 12% 8%,#FFE7B8 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,#FDE0C8 0 90px,transparent 91px),radial-gradient(circle at 6% 88%,#E6F2D8 0 140px,transparent 141px);
  background-attachment:fixed;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #3E7CD6;outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
.wrap{max-width:1040px;margin:0 auto}
.btn{font-family:var(--display);font-weight:600;font-size:18px;border:0;border-radius:14px;padding:11px 18px;background:var(--accent);color:#3A2600;box-shadow:0 4px 0 var(--accent-d);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.small{font-size:15px;padding:7px 12px;border-radius:11px}
.btn.danger{background:#FBE1DE;color:var(--bad);box-shadow:0 4px 0 #EBB5AF}

/* who's playing */
#who{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
#who h1{font-size:clamp(38px,7vw,60px);color:var(--ink);letter-spacing:.01em}
#who h1 span{display:block;font-size:.42em;color:var(--ink2);font-weight:500;margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase}
.kids{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.kidbtn{border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(130px,26vw,190px);border-radius:24px;transition:transform .12s}
.kidbtn:active{transform:scale(.95)}
.kidbtn:hover .face{transform:translateY(-4px) rotate(-3deg)}
.face{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(64px,13vw,98px);background:var(--c);
  box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 -10px 0 rgba(0,0,0,.12),inset 0 10px 0 rgba(255,255,255,.25);border:5px solid #fff;transition:transform .18s}
.kidbtn b{font-family:var(--display);font-size:clamp(24px,4vw,32px);font-weight:600}
.grownups{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink2);font-weight:700;font-size:15px;padding:10px}
.grownups svg{width:18px;height:18px}

/* shelf */
.shelfTop{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.me .face{width:64px;height:64px;font-size:38px;border-width:3px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.me h1{font-size:clamp(28px,5vw,40px)}
.me p{margin:2px 0 0;color:var(--ink2)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.game{border:0;padding:0;text-align:left;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--line),0 10px 24px rgba(60,40,10,.08);display:flex;flex-direction:column;transition:transform .12s;min-width:0}
.game:hover{transform:translateY(-3px)}
.game:active{transform:translateY(2px)}
.art{height:150px;position:relative;display:grid;place-items:center;font-size:78px;background:linear-gradient(150deg,var(--a),var(--b));overflow:hidden}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35) 0 40px,transparent 41px),radial-gradient(circle at 85% 85%,rgba(255,255,255,.18) 0 60px,transparent 61px)}
.art span{position:relative;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));transition:transform .2s}
.game:hover .art span{transform:scale(1.08) rotate(-4deg)}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gbody h2{font-size:23px}
.gbody p{margin:0;color:var(--ink2);font-size:15px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:#6A4A1A}
.tag.Math{background:#DDF0F4;color:#1C6676}.tag.Reading{background:#DFF2E4;color:#1E5A40}.tag.Grammar{background:#FFE6D6;color:#A8431A}.tag.Spelling{background:#ECE4FA;color:#583D9C}
.last{font-size:13px;color:var(--ink2)}
.game.soon{opacity:.75;cursor:default}
.game.soon .art{filter:saturate(.5)}
.ribbon{position:absolute;top:12px;right:-34px;transform:rotate(35deg);background:#fff;color:var(--ink);font:600 14px var(--display);padding:4px 40px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.speakkid .gbody p,.speakkid .last{display:none}
.speakkid .art{height:190px;font-size:100px}
.empty{background:var(--card);border-radius:22px;padding:30px;text-align:center;color:var(--ink2);box-shadow:0 6px 0 var(--line)}

/* grown-ups */
.pin{max-width:360px;margin:8vh auto 0;text-align:center}
.pin h1{font-size:34px}
.pin p{color:var(--ink2);margin:8px 0 0}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink2)}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:600 26px var(--display);box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .alt{font:700 15px var(--body);color:var(--ink2)}
.panelTop{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panelTop h1{font-size:34px;margin-right:auto}
.kcard{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line);margin-bottom:18px}
.khead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.khead .face{width:56px;height:56px;font-size:32px;border-width:3px;box-shadow:none}
.khead input{font:600 24px var(--display);border:2px solid transparent;border-radius:10px;padding:2px 8px;background:transparent;color:var(--ink);min-width:0;width:12ch;flex:1 1 140px}
.khead input:hover,.khead input:focus{border-color:var(--line);background:#FFFCF5;outline:none}
.khead .sp{flex:1}
.sec{margin-top:16px}
.sec h3{font-size:17px;color:var(--ink2);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.emo{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;display:grid;place-items:center;padding:0}
.emo.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.col{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.col.on{box-shadow:0 0 0 3px var(--ink)}
.chk{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:7px 12px 7px 9px;background:#fff;font-weight:700;font-size:15px}
.chk.on{border-color:var(--good);background:#E8F6EC}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink2);display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.chk.on .box{background:var(--good);border-color:var(--good)}
.chk small{font-weight:400;color:var(--ink2)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700}
.tg{position:relative;width:52px;height:30px;border-radius:99px;border:0;background:#D6CCB8;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-pressed="true"]{background:var(--good)}
.tg[aria-pressed="true"]::after{left:25px}
.toggle small{display:block;font-weight:400;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid #F2E8D6;vertical-align:top}
.tbl .gname{font-weight:700;white-space:nowrap}
.acc{display:inline-block;font-size:13px;margin:0 6px 2px 0;white-space:nowrap}
.acc b{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FBE1DE;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:15px}
.note{color:var(--ink2);font-size:14.5px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:560px){.games{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.art{height:110px;font-size:58px}.speakkid .art{height:140px;font-size:76px}.gbody{padding:10px 12px 12px}.gbody h2{font-size:19px}.gbody p{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="who">
    <h1><span>Game Room</span>Who's playing?</h1>
    <div class="kids" id="kids"></div>
    <button class="grownups" id="toGrown"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4.5" y="10.5" width="15" height="11" rx="3"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>Grown-ups</button>
  </section>

  <section id="shelf" hidden>
    <div class="shelfTop">
      <div class="me"><div class="face" id="meFace"></div><div><h1 id="meHi"></h1><p id="meSub">Pick a game</p></div></div>
      <button class="btn ghost" id="switchBtn">Switch player</button>
    </div>
    <div class="games" id="games"></div>
  </section>

  <section id="grown" hidden>
    <div class="pin" id="pinBox">
      <h1 id="pinTitle">Grown-ups</h1>
      <p id="pinSub">Enter your PIN.</p>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="pad" id="pad"></div>
      <p style="margin-top:18px"><button class="btn ghost small" id="pinBack">Back</button></p>
    </div>
    <div id="panel" hidden></div>
  </section>
</div>
<script src="games/catalog.js"></script>
<script src="hub.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=HUB,S=H.load();
const EMOJI=['🦊','🐸','🐺','🦁','🐯','🐻','🐼','🐨','🐵','🦖','🐙','🦈','🐲','🦄','🐧','🦉','🚀','⚽','🤖','👾'];
const COLORS=['#E8742E','#2FA35A','#3E7CD6','#8E5BD6','#D2463C','#E0A21E','#1FA38A','#D84E8A','#5A6378'];
const show=id=>{['who','shelf','grown'].forEach(v=>$('#'+v).hidden=v!==id);window.scrollTo(0,0)};
let toastT=0;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

/* ---------- who's playing ---------- */
function renderWho(){const box=$('#kids');box.innerHTML='';
  S.kids.forEach(k=>{const b=document.createElement('button');b.className='kidbtn';b.style.setProperty('--c',k.color);
    b.innerHTML=`<div class="face">${esc(k.emoji)}</div><b>${esc(k.name)}</b>`;
    b.onclick=()=>{H.say(k.name+'!');openShelf(k.id)};box.appendChild(b)});
  show('who')}

/* ---------- shelf ---------- */
let curKid=null;
function openShelf(id){const k=H.kid(id);if(!k){renderWho();return}curKid=k;
  try{sessionStorage.setItem('hub.kid',k.id)}catch(e){}
  if(location.hash!=='#'+k.id)history.replaceState(null,'','#'+k.id);
  const f=$('#meFace');f.textContent=k.emoji;f.style.setProperty('--c',k.color);
  $('#meHi').textContent='Hi, '+k.name+'!';$('#meSub').textContent=k.speak?'Tap a game to play':'Pick a game';
  const box=$('#games');box.innerHTML='';box.classList.toggle('speakkid',!!k.speak);
  const list=k.games.map(H.game).filter(Boolean);
  if(!list.length){box.innerHTML='<div class="empty">No games yet. Ask a grown-up to pick some.</div>'}
  list.forEach(g=>{const lg=(S.log[k.id]||{})[g.id];const b=document.createElement('button');b.className='game'+(g.soon?' soon':'');
    b.innerHTML=`<div class="art" style="--a:${g.bg[0]};--b:${g.bg[1]}"><span>${g.emoji}</span>${g.soon?'<div class="ribbon">Soon!</div>':''}</div>
     <div class="gbody"><h2>${esc(g.title)}</h2><p>${esc(g.blurb)}</p><div class="tags">${g.subjects.map(s=>`<span class="tag ${s}">${s}</span>`).join('')}</div>
     ${lg&&lg.last?`<div class="last">Played ${esc(H.ago(lg.last).toLowerCase())}</div>`:''}</div>`;
    b.onclick=()=>{if(g.soon){H.say(g.title+' is coming soon!');toast(g.title+' is coming soon');return}
      if(k.speak){H.say(g.title);setTimeout(()=>go(k,g),850)}else go(k,g)};
    box.appendChild(b)});
  show('shelf')}
function go(k,g){location.href='play.html?g='+encodeURIComponent(g.id)+'&k='+encodeURIComponent(k.id)}
$('#switchBtn').onclick=()=>{try{sessionStorage.removeItem('hub.kid')}catch(e){}history.replaceState(null,'',location.pathname);renderWho()};

/* ---------- grown-ups: PIN ---------- */
let pinBuf='',pinMode='enter',pinFirst='';
function openGrown(){pinBuf='';if(!S.pin){pinMode='new';$('#pinTitle').textContent='Make a grown-up PIN';$('#pinSub').textContent='Pick 4 numbers. Kids need it to change games.'}
  else{pinMode='enter';$('#pinTitle').textContent='Grown-ups';$('#pinSub').textContent='Enter your PIN.'}
  $('#pinBox').hidden=false;$('#panel').hidden=true;dots();show('grown')}
function dots(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length))}
function badPin(msg){const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pinBuf='';dots();if(msg)$('#pinSub').textContent=msg}
function pinKey(v){if(v==='del'){pinBuf=pinBuf.slice(0,-1);dots();return}if(pinBuf.length>=4)return;pinBuf+=v;dots();if(pinBuf.length<4)return;
  setTimeout(()=>{if(pinMode==='enter'){if(pinBuf===S.pin)openPanel();else badPin('That’s not it. Try again.')}
    else if(pinMode==='new'){pinFirst=pinBuf;pinBuf='';pinMode='confirm';$('#pinSub').textContent='Type it one more time.';dots()}
    else if(pinMode==='confirm'){if(pinBuf===pinFirst){S.pin=pinBuf;H.save();toast('PIN saved');openPanel()}else{pinMode='new';badPin('Those didn’t match. Pick 4 numbers again.')}}},140)}
(function(){const p=$('#pad');['1','2','3','4','5','6','7','8','9','','0','del'].forEach(v=>{const b=document.createElement('button');if(!v){b.style.visibility='hidden';p.appendChild(b);return}
  b.textContent=v==='del'?'Delete':v;if(v==='del')b.className='alt';b.onclick=()=>pinKey(v);p.appendChild(b)})})();
document.addEventListener('keydown',e=>{if($('#grown').hidden||$('#pinBox').hidden)return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del')});
$('#toGrown').onclick=openGrown;$('#pinBack').onclick=()=>renderWho();

/* ---------- grown-ups: panel ---------- */
const confirmOpen={};
function openPanel(){$('#pinBox').hidden=true;const P=$('#panel');P.hidden=false;
  let h=`<div class="panelTop"><h1>Grown-ups</h1><button class="btn" id="addKid">+ Add a kid</button><button class="btn ghost" id="doneBtn">Done</button></div>`;
  S.kids.forEach(k=>{h+=kidCard(k)});
  h+=`<div class="kcard"><div class="sec" style="margin-top:0"><h3>About saves</h3><p class="note">Each kid's progress is saved separately, in this browser on this device. If the kids play on two different tablets, each tablet keeps its own progress.</p>
   <div class="row" style="margin-top:10px"><button class="btn ghost small" id="chgPin">Change PIN</button></div></div></div>`;
  P.innerHTML=h;bindPanel();show('grown');$('#pinBox').hidden=true}
function kidCard(k){const L=S.log[k.id]||{};
  const rows=window.CATALOG.filter(g=>!g.soon).map(g=>{const e=L[g.id],pr=H.progress(k.id,g.id);if(!e&&!pr)return'';
    const acc=pr&&pr.subjects.length?pr.subjects.map(s=>`<span class="acc">${s.s}: <b>${s.ok}/${s.q}</b> (${Math.round(s.ok/s.q*100)}%)</span>`).join(''):'<span class="note">No answers yet</span>';
    const ck=k.id+'|'+g.id;
    return `<tr><td class="gname">${g.emoji} ${esc(g.title)}</td><td>${e?esc(H.ago(e.last)):'—'}</td><td>${e?H.fmtDur(H.weekSec(e)):'—'}</td><td>${e?H.fmtDur(e.sec):'—'}</td><td>${acc}</td>
      <td>${confirmOpen[ck]?`<div class="confirm" style="margin:0">Erase?<button class="btn danger small" data-wipe="${ck}">Erase</button><button class="btn ghost small" data-nowipe="${ck}">Keep</button></div>`:`<button class="btn ghost small" data-askwipe="${ck}">Start over</button>`}</td></tr>`}).join('');
  return `<div class="kcard" data-kid="${k.id}">
   <div class="khead"><div class="face" style="--c:${k.color}">${esc(k.emoji)}</div><input value="${esc(k.name)}" maxlength="16" aria-label="Name" data-name="${k.id}"><span class="sp"></span>
    ${confirmOpen['kid|'+k.id]?`<div class="confirm" style="margin:0">Remove ${esc(k.name)} and all their progress?<button class="btn danger small" data-delkid="${k.id}">Remove</button><button class="btn ghost small" data-nodel="${k.id}">Keep</button></div>`:`<button class="btn ghost small" data-askdel="${k.id}">Remove</button>`}</div>
   <div class="sec"><h3>Picture</h3><div class="row">${EMOJI.map(e=>`<button class="emo${e===k.emoji?' on':''}" data-emo="${k.id}" data-v="${e}">${e}</button>`).join('')}</div>
    <div class="row" style="margin-top:8px">${COLORS.map(c=>`<button class="col${c===k.color?' on':''}" style="background:${c}" data-col="${k.id}" data-v="${c}" aria-label="Color"></button>`).join('')}</div></div>
   <div class="sec"><div class="toggle"><button class="tg" aria-pressed="${!!k.speak}" data-speak="${k.id}" aria-label="Read aloud"></button><span>Read things out loud<small>For kids who can't read yet: names and game titles are spoken, and game cards get bigger.</small></span></div></div>
   <div class="sec"><h3>Games on ${esc(k.name)}'s shelf</h3><div class="row">${window.CATALOG.map(g=>{const on=k.games.includes(g.id);return`<button class="chk${on?' on':''}" data-game="${k.id}" data-v="${g.id}"><span class="box">${on?'✓':''}</span>${g.emoji} ${esc(g.title)}${g.soon?' <small>(soon)</small>':''}</button>`}).join('')}</div></div>
   <div class="sec"><h3>Progress</h3>${rows?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Game</th><th>Last played</th><th>This week</th><th>All time</th><th>Answers right</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="note">${esc(k.name)} hasn't played anything here yet.</p>`}</div>
  </div>`}
function bindPanel(){const P=$('#panel');
  $('#doneBtn').onclick=()=>renderWho();
  $('#addKid').onclick=()=>{const id='kid-'+Date.now().toString(36);S.kids.push({id,name:'New player',emoji:EMOJI[S.kids.length%EMOJI.length],color:COLORS[S.kids.length%COLORS.length],speak:false,games:[]});H.save();openPanel();
    const inp=P.querySelector(`[data-name="${id}"]`);if(inp){inp.scrollIntoView({block:'center'});inp.focus();inp.select()}};
  $('#chgPin').onclick=()=>{S.pin=null;H.save();openGrown()};
  P.querySelectorAll('[data-name]').forEach(i=>{i.onchange=()=>{const k=H.kid(i.dataset.name);const v=i.value.trim();if(v){k.name=v;H.save();toast('Saved')}else i.value=k.name}});
  P.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;let k;
    if(d.emo){k=H.kid(d.emo);k.emoji=d.v}
    else if(d.col){k=H.kid(d.col);k.color=d.v}
    else if(d.speak){k=H.kid(d.speak);k.speak=!k.speak}
    else if(d.game){k=H.kid(d.game);const i=k.games.indexOf(d.v);if(i>=0)k.games.splice(i,1);else{const order=window.CATALOG.map(g=>g.id);k.games.push(d.v);k.games.sort((a,b)=>order.indexOf(a)-order.indexOf(b))}}
    else if(d.askwipe){confirmOpen[d.askwipe]=1}
    else if(d.nowipe){delete confirmOpen[d.nowipe]}
    else if(d.wipe){const [kid,g]=d.wipe.split('|');H.wipe(kid,g);delete confirmOpen[d.wipe];toast('Progress erased')}
    else if(d.askdel){confirmOpen['kid|'+d.askdel]=1}
    else if(d.nodel){delete confirmOpen['kid|'+d.nodel]}
    else if(d.delkid){H.wipeKid(d.delkid);S.kids=S.kids.filter(x=>x.id!==d.delkid);delete confirmOpen['kid|'+d.delkid]}
    else return;
    H.save();const y=window.scrollY;openPanel();window.scrollTo(0,y)}}

/* ---------- start ---------- */
let start=null;try{start=location.hash.slice(1)||sessionStorage.getItem('hub.kid')}catch(e){}
if(start&&H.kid(start))openShelf(start);else renderWho();
window.addEventListener('pageshow',e=>{if(e.persisted&&curKid&&!$('#shelf').hidden)openShelf(curKid.id)});
})();
</script>
</body>
</html>
